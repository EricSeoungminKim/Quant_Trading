# systemd-journald 용량 상한 (2026-09-03).
#
# 왜: 이 박스는 RAM 1.8GB / 디스크도 넉넉하지 않은 t4g 급인데, quant-engine 저널이
# 혼자 **1.8GB**까지 자랐다(2026-09-02 실측). 원인은 엔진이 시간당 2만 줄을 찍던
# 것이고 그 로그량 자체는 같은 날 고쳤지만, **상한이 없다는 사실은 그대로였다** —
# 다음에 어떤 프로세스가 시끄러워지면 똑같이 디스크를 채운다. 저널이 디스크를
# 채우면 장중에 엔진이 상태 파일(risk_day.json / strategy_books.json / 원장)을
# 쓰지 못하고, 그건 곧 금전적 손실이다. 그래서 로그량과 별개로 상한을 건다.
#
# SystemMaxUse=300M — 영속 저널 전체(모든 유닛 합산) 상한. 300M이면 현재 로그량
#   기준 2주 이상 남고, 1.8GB 박스에서 부담이 없다.
# MaxRetentionSec=14day — 사후분석에 필요한 기간(주간 스코어보드 + 지난주 사건
#   추적)만 남긴다. 용량 상한과 기간 상한 중 **먼저 걸리는 쪽**이 이긴다.
#
# 설치: server/scripts/setup_ec2.sh 가 /etc/systemd/journald.conf.d/ 로 복사하고
# systemd-journald 를 재시작한다(엔진 무접촉 — 저널 데몬만 재시작된다).
[Journal]
SystemMaxUse=300M
MaxRetentionSec=14day
