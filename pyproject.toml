[project]
name = "quant-trading-kiwoom"
version = "0.2.0"
description = "KR/US 자동매매 + 뉴스 수집 + 시황 리포트 — 4평면 단일 저장소"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "yfinance>=1.5.2",
    # 아래 셋은 2026-08-13 market_report 흡수로 편입됐다 (수집·분석 평면 전용).
    # 거래 평면은 이 셋 없이도 돌아야 한다 — 아키텍처 테스트가 강제한다.
    "lxml>=5.0",
    "jinja2>=3.1",
    # 분석 저장소(Phase 3). 순수 파이썬이라 EC2 에 빌드 의존이 없다.
    # **거래 평면은 이걸 임포트할 수 없다** — test_architecture.py 가 막는다.
    "pymysql>=1.1",
    # 휘발성 캐시(Phase 3b). 없어도 NullKeyValue 로 동작한다 — 선택 사항이다.
    "redis>=5.0",
    # Parquet 위 분석 질의(Phase 4). **데몬이 아니라 라이브러리** — 1.8GB 박스에서
    # 상주 메모리를 안 먹는다. 봉 데이터를 MySQL 에 넣지 않기 위한 선택.
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=7.0",
    "matplotlib>=3.9",
    "nbformat>=5.10",
    "nbconvert>=7.17.1",
    "vulture>=2.16",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.6",
]
# 파라미터 최적화/walk-forward 검증(quant_engine/research/) 전용 — 선택 의존성.
# AWS 배포는 거래 엔진(quant_engine.run paper)만 돌리므로 이 그룹 없이도 동작해야
# 한다. optuna/quantstats는 항상 함수 내부에서 지연 임포트한다.
# scikit-learn: 로컬 맥 ML 학습 하네스(quant/research/ml_train.py, 2026-08-30
# local/ml/run.sh 전용) — joblib은 scikit-learn 의존성으로 함께 들어온다.
research = [
    "optuna>=4.0",
    "quantstats>=0.0.62",
    "scikit-learn>=1.5",
]

[tool.ruff]
# p95 줄 길이가 105자(전체 quant/+tests/ 18.5만 줄 실측) — 110으로 잡으면 대부분
# 통과한다. E501 은 그래도 ignore(아래) — 4,246줄이 110을 넘어 전면 재래핑
# 없이는 못 없앤다, 이번 패스는 "무동작"이 원칙이라 보류.
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    # 줄 길이 — 위 주석 참고. 강제하려면 대량 재래핑이 필요해 무동작 원칙에 어긋난다.
    "E501",
    # 기본 인자에서 함수 호출 — 트레이딩 파라미터 조립에 흔한 패턴, 재작성 리스크 대비 이득이 적다.
    "B008",
    # if/else 블록 vs 삼항연산자 — 가독성이 갈리는 판단이라 일괄 강제하지 않는다.
    "SIM108",
    # zip(strict=)는 호출부마다 다른 도메인 판단(길이 불일치 시 예외 vs 무시) — 기계적으로 못 정한다.
    "B905",
    # 모호한 변수명(l/O/I 등) — 오토픽스가 없고, 스코프별로 확인 없이 일괄 개명하면 위험하다.
    "E741",
    # 중첩 with 병합 — 제어흐름 재작성이라 "무동작 증명 안 되면 되돌린다" 원칙에 걸린다.
    "SIM117",
    # raise ... from e 누락 — 추가하면 예외 체이닝(__cause__) 의미가 바뀐다.
    "B904",
    # try/except/pass → contextlib.suppress — 예외 처리 제어흐름 재작성.
    "SIM105",
    # 안 쓰는 루프 변수 — 이름 변경 자체는 안전하지만 개별 확인 없는 일괄 처리는 보류.
    "B007",
    # %-포매팅 → f-string/.format() — 문자열 표현식 재작성, 패딩/정밀도 차이 위험.
    "UP031",
    # (str, Enum) → StrEnum — 직렬화·포맷 동작이 버전별로 미묘하게 달라 손대지 않는다.
    "UP042",
    # 중첩 if 병합 — 제어흐름 재작성.
    "SIM102",
    # open()에 컨텍스트매니저 강제 — 리소스 관리 패턴 변경, 이번 범위 밖.
    "SIM115",
    # true/false만 반환하는 if/else 통합 — trade 평면 조건문도 포함돼 있어 손대지 않는다.
    "SIM103",
    # pytest.raises(Exception) 같은 광역 assert — 테스트 관례상 의도적인 경우와 섞여
    # 있어 개별 판단이 필요하다.
    "B017",
    # 클로저의 루프 변수 캡처 — 실제 버그일 수도 있어 일괄 무시 대신 개별 확인이 맞지만
    # 확인한 2건은 모두 루프 안에서 즉시 소비돼 안전하다(late-binding 미해당).
    "B023",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 네트워크를 타는 테스트 (기본 실행에서 제외)",
    "e2e: server/scripts/*.sh 를 서브프로세스로 실제 실행하는 테스트 — QT_E2E=1일 때만 (기본 실행에서 제외)",
]
# importlib 모드가 필요한 이유: 두 저장소를 합치면서 tests/ 와 tests/report/ 에
# 같은 이름의 파일이 생겼다(test_clock.py, test_indicators.py). 기본 prepend
# 모드는 basename 이 겹치면 "import file mismatch" 로 죽는다.
addopts = "-m 'not live and not e2e' --import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant"]
