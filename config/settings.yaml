  news_momentum:
    class: news_momentum
    # 2026-08-12 사용자 요청: "9시 세션 시작 때 딱히 하는 게 없다" — 뉴스 호재
    # (08:40 daily-brief가 뽑고 watch_scorer가 채점한 EVENT 태그)가 있는 관심종목만
    # 대상으로 개장 즉시 매수, 고정 % 사다리(−2% 손절 / +5% 절반 익절 / +10% 전량
    # / 30분 타임아웃)로 단타 청산한다. news_momentum.py 상단 docstring에 정직성
    # 경고([미검증], 개장가 진입의 구조적 불리함, 타이트한 손절, 상한가급 목표)를
    # 명시했다 — 여기서 다시 반복하지 않는다. 수익성 주장 없음, paper 번인 시작.
    enabled: true
    # 2026-08-12 시장별 분리(파일 상단 표 참고): US 0.0은 성과 판단이 아니라
    # EVENT 태그 소스(회사 데일리 리포트) 자체가 한국 종목에만 있어서다.
    # 2026-08-17: KR 0.2 → 0.1 — 갈래 A/B(spec §5)에 KR 50%를 내주려 갈래 C
    # 기존 비중을 균등 x0.5(파일 상단 "3갈래 자본 배분" 표 참고).
    capital_fraction:
      KR: 0.1

      US: 0.0
    validation:
      status: burn_in # 백테스트 미검증 — 스코어보드 30건 + 유의(양) 전까지 승격 금지
    universe: watchlist # tags_of(EVENT)도 관심종목 파일에서 함께 읽는다 — assembly.rebuild_strategies 참고
    symbols: []
    params:
      # 봉 간격 선언(2026-09-03 감사 C4). 이 전략의 실제 봉은 1m다(news_momentum.py
      # `history(symbol, "1m", ...)`). 손절 쿨다운 봉 카운팅과 과거데이터 프로브가 읽는다 —
      # 선언이 없으면 조용히 폴백 15m로 해석됐다. 실효 쿨다운 표는 risk 블록 주석 참고.
      bar_interval_minutes: 1
      cooldown_bars_after_stop: 15 # 1m x 15봉 = 15분
      entry_window_seconds: 120 # 개장 후 이 시간(초) 안에만 진입 시도 — 놓치면 그날은 진입 안 함
      # 개장 확인(2026-08-19): 첫 1분봉이 **양봉으로 마감**했을 때만 진입한다.
      # 근거 두 가지:
      #  (1) 메커니즘 — 이 전략은 개장 11초 만에 샀다. 그날 가격 정보가 하나도
      #      없는 상태(앵커도 종목도 첫 1분봉 미완성)라 시장 리스크오프 가드조차
      #      판정이 불가능했다. "정보 없이 시가를 산다"가 구조적 결함이다.
      #  (2) 실측 — 원장 누적 성적이 전 전략 중 최악(6청산 1승, 순 -27,018원)이고,
      #      08-18 손실 3건(-28,996원, 그날 총손실의 61%)에 이 규칙을 소급하면
      #      셋 다 첫 봉이 양봉이 아니어서 **진입 자체가 없다**(손실 0). 표본은
      #      1일 3건으로 작지만 규칙의 근거는 그날 결과가 아니라 (1)이다.
      # 첫 봉은 09:01 에 마감하므로 위 entry_window_seconds(120초) 안에서 확인이
      # 끝난다. above_open(5분)으로 바꾸려면 창도 함께 늘려야 한다(모듈 docstring).
      open_confirm_mode: bar
      # 2026-08-13: 3 → 5. 첫 실전에서 EVENT 후보 8개 중 3개만 들어갔고, 그마저
      # 관심종목 파일 순서(=알파벳)로 골라 랭킹 1·2위 삼성전자·SK하이닉스가 밀렸다.
      # 선정 순서는 _rank_candidates 로 고쳤고, 상한은 US 하드캡과 같은 5로 맞춘다.
      max_entries_per_session: 5
      stop_loss_pct: 2.0
      partial_take_pct: 5.0
      partial_fraction: 0.5
      full_take_pct: 10.0
      # null = 시간 청산 없음. 손절(-2%)·부분익절(+5%)·목표가(+10%)·EoD 강제청산만으로
      # 관리한다(2026-08-13 사용자 지시). 실측 참고: 그날 30분 타임아웃은 LG이노텍을
      # +3.5%에서 끊었고(더 갈 수도 있었다), 대신증권은 -1.4%에서 끊었다(없었으면
      # -2% 손절까지 흘렀을 것이다) — 타임아웃은 애매한 포지션을 정리하는 장치였다.
      max_hold_minutes: null
      risk_budget_pct: 1.0
      max_leverage: 1.0
      flatten_before_close_minutes: 1

  news_scalp:
    class: news_scalp
    # 갈래 A(spec §5, 2026-08-17) — intraday_scorer v4(H-2) 후보의 개장 진입·당일
    # 청산 고정 전략. quant/trade/strategy/news_scalp.py 상단 docstring 참고
    # (news_momentum과 달리 부분익절 없이 손절+EoD 둘 뿐 — 의도적으로 단순).
    # **활성화(2026-08-17, 서브프로젝트 T Task 3)** — EVENT_SCALP 태그 배선 완료:
    # close_engine.json의 intraday_view → market_brief.intraday_scalp_tokens →
    # brief_from_report TOKENS → watch-score(EVENT 프로필 별칭) → watch-add. 태그가
    # 실제로 안 붙으면(리포트 미발행 등) tags_of에 EVENT_SCALP가 없어 여전히 조용히
    # 아무 것도 하지 않는다 — 그 경우는 paper 표본이 안 쌓일 뿐 위험하지 않다.
    # 2026-08-25 소유자 지시(전략 4종 체제): 한국장 중심 재편 — ①뉴스·미국섹터
    # 개장 단타(news_momentum) ②1분봉 스캘핑(scalp_1m) ③종가배팅(close_bet, 신규)
    # ④외국인 추세(frgn_accumulate). 이 4종과 겹치지 않는 전략은 오늘 미국장부터
    # **비활성** — 코드·원장은 남긴다(측정 기준점 + 추후 복원).
    # **2026-09-03 재활성** — 위 2026-08-25 비활성(전략 4종 체제)을 A/B 실험을
    # 위해 되돌린다. 이 전략은 그 자체로 "after" 갈래다: EVENT_SCALP 태그(뉴스
    # 촉매)가 붙은 종목만, 개장 즉시 진입한다. scalp_1m/scalp_1m_cat 쌍이 "같은
    # 진입 규칙 · 다른 유니버스"를 재는 것과 달리, 이 쌍(news_scalp vs scalp_1m)은
    # "같은 유니버스 · 다른 진입 시점"을 잰다 — 둘 다 촉매 가설을 때리는 각도가
    # 다르다. 유니버스 게이트는 설계 그대로 EVENT_SCALP(코드의 tags_of) 이므로
    # universe_filter 를 걸지 않는다.
    enabled: true
    # KR 0.1 → 0.04 (2026-09-03): 표본을 쌓는 게 목적이라 최소 규모로 재가동한다.
    # 프로토콜 바닥(0.03) 바로 위 — tests/test_validation_gate.py 가 강제한다.
    capital_fraction:
      KR: 0.04
      US: 0.0
    validation:
      status: burn_in # 신규 전략 — 백테스트 미검증. intraday_verify n>=30 + 수수료 후 양(+) 이후 승격 판단
    universe: watchlist # tags_of(EVENT_SCALP)도 관심종목 파일에서 함께 읽는다
    symbols: []
    params:
      # 봉 간격 선언(2026-09-03 감사 C4). 실제 봉은 1m(news_scalp.py
      # `history(anchor, "1m", 400)`). 실효 쿨다운 표는 risk 블록 주석 참고.
      bar_interval_minutes: 1
      cooldown_bars_after_stop: 15 # 1m x 15봉 = 15분
      entry_window_seconds: 120 # 개장 후 이 시간(초) 안에만 진입 시도 — 놓치면 그날은 진입 안 함
      max_entries_per_session: 3
      # 3.0%: 백테스트 최적값이 아니라 과도 손실 꼬리를 자르는 보수적 기본값
      # (news_scalp.py 상단 docstring "청산" 절 — 비대칭 청산 고도화는 fitness
      # 근거가 쌓인 뒤로 미룬다는 스펙 방침).
      stop_loss_pct: 3.0
      flatten_before_close_minutes: 1

  frgn_accumulate:
    class: frgn_accumulate
    # 갈래 B(spec §5, 2026-08-17) — 외국인 수급 추세 태그(FRGN/FRGN_EXIT) 기반
    # 일 1회 적립 매수 + 이탈 분할 청산. quant/trade/strategy/frgn_accumulate.py
    # 상단 docstring 참고.
    # **활성화(2026-08-17, 서브프로젝트 T Task 3)** — FRGN/FRGN_EXIT 태그 배선
    # 완료: data/ledger/frgn_flow.jsonl → foreign_trend.classify() →
    # market_brief.foreign_flow_tokens → brief_from_report TOKENS(FRGN)/
    # FRGN_EXIT 줄 → watch-add(--tags-only로 이탈 태그 갱신). 태그가 안 붙으면
    # (수급 원장 없음 등) tags_of에 FRGN이 없어 조용히 아무 것도 하지 않는다.
    # **2026-08-19 고정액→고정수량 전환**: fixed_amount_krw/assumed_capital_krw
    # (고정액 근사 — 전략 자본 규모를 추정해 target_weight를 역산)를 buy_qty로
    # 대체했다. assumed_capital_krw가 낡은 값(500만)에 고정된 채 전략 자본이
    # 1,000만으로 바뀌어 001450 매수가 의도(10만원)의 2배(20만원)로 튄 사고의
    # 근본 수정 — Signal.target_qty로 risk 레이어에 수량 자체를 전달하므로
    # 전략 자본 추정이 아예 필요 없다.
    # 2026-09-03 소유자 결정: 자동매매는 단타·스캘핑만 — 오버나이트 아이디어는
    # manual_recs 레인으로 텔레그램 추천. 이 전략은 판단 자체가 일 1회 적립매수 +
    # 이탈 시 분할청산(오버나이트 보유가 전략 정의)이라 대상. 코드·params·
    # capital_fraction은 그대로 둔다(자본 재분배 없음 — 현금 버퍼로 남긴다).
    enabled: false
    capital_fraction:
      KR: 0.14

      US: 0.0
    validation:
      status: burn_in # 신규 전략 — 백테스트 미검증. paper 원장 20거래일 이후 승격 판단(§4)
    universe: watchlist # tags_of(FRGN/FRGN_EXIT)도 관심종목 파일에서 함께 읽는다
    symbols: []
    params:
      # 봉 간격 선언(2026-09-03 감사 C4). 이 전략은 봉을 안 보고 시세(quote)만 보지만,
      # 판단 자체가 **하루 1회**(모듈 docstring "판단 빈도: 일 1회")라 쿨다운의 자연 단위도
      # 하루다. 쿨다운 봉 카운팅은 이 값으로 일봉("1d")을 조회한다.
      bar_interval_minutes: 1440
      cooldown_bars_after_stop: 1 # 1일 x 1봉 = 1거래일
      buy_qty: 1 # 평가마다 이 수량(주)만 산다 — 자본 규모와 무관, 하드레일은 그대로 적용
      eval_after_minutes_after_open: 60
      exit_fraction_first: 0.5

  close_bet:
    class: close_bet
    # 종가배팅(2026-08-25, 전략 4종 체제 ③) — 장중 리포트가 수급·거래대금·뉴스
    # 지속성으로 채점해 CLOSE_BET 태그를 준 종목만, **오후장 15:00~15:19**(소유자
    # 원 스펙 "15:00~15:20 선정" — 상한 15:19 는 동시호가 직전)에 차트 확인
    # (양봉 + 마감강도>=0.7) 후 진입 → **다음날 아침 반드시 매도**(갭 실현).
    # 2026-08-26 소유자 정정: "종가 단타가 아니라 오후장에 구매해서 다음날 아침
    # 상승갭을 미리 예상하고 판단해서 진입. 즉 다음날 아침에 팔아야 해" — 같은 날
    # 한때 15:15 로 좁힌 것은 잘못 읽은 의도의 과최적화라 되돌림. 15:20 이후
    # 진입 금지는 유지(close_bet.py in_continuous_session 가드).
    # 손절 -1% < 익절 +2% (잃을 땐 적게, 벌 땐 많이) + 시초 30분 데드라인.
    # 규칙 근거(웹 리서치)는 quant/trade/strategy/close_bet.py docstring.
    # 2026-09-03 소유자 결정: 자동매매는 단타·스캘핑만 — 오버나이트 아이디어는
    # manual_recs 레인으로 텔레그램 추천. 이 전략은 정의 자체가 "오늘 사서 내일
    # 아침 판다"(오버나이트 갭 실현)라 대상. 코드·params·capital_fraction은
    # 그대로 둔다(자본 재분배 없음 — 현금 버퍼로 남긴다).
    enabled: false
    # 2026-09-03: KR 0.1→0.2 + target_weight 0.1→0.5. 실측(EC2 9/2 15:00) '배분 자금
    # 부족(예산 95,888원)' — 종가배팅은 한 종목을 통째로 사는 전략인데 예산이
    # 200,000원대 대형주 1주도 못 샀다(8/25 이후 체결 0건의 원인). declared 정책
    # 기준 장부 ≈55만원, 1회 베팅 ≈27만원 → 27만원 이하 종목 1주 이상.
    capital_fraction:
      KR: 0.2

      US: 0.0
    validation:
      status: burn_in # 백테스트 [미검증] — 표본은 experiments 루프가 판정
    universe: watchlist
    symbols: []
    params:
      # 봉 간격 선언(2026-09-03 감사 C4). 실제 봉은 1m(close_bet.py `history(symbol, "1m", 400)`).
      bar_interval_minutes: 1
      cooldown_bars_after_stop: 15 # 1m x 15봉 = 15분
      entry_start_hhmm: [15, 0]
      entry_end_hhmm: [15, 19]
      min_close_strength: 0.7
      target_weight: 0.5 # 2026-09-03: 0.1→0.5 (위 capital_fraction 주석) — 하루 최대 2종목
      stop_pct: 1.0
      take_profit_pct: 2.0
      exit_deadline_minutes_after_open: 30

  # 오버나이트 드리프트(2026-08-28) — 종가 5분 전 매수 → 익일 개장 5분 내 매도.
  # 문헌(Lachance RFE 2023 등): 특정 ETF 표본에서 총수익이 사실상 전부 밤에 발생
  # (오버나이트 +12.9%/yr vs 인트라데이 -4.3%/yr), 비용 후에도 성립 가능 보고.
  # 왕복 1회로 하루치를 먹어 비용 대비 마진이 우리 후보 중 최고. 동시에 **일중
  # 전략들의 벤치마크** — 스캘핑이 이걸 못 이기면 일중 매매를 할 이유가 없다.
  # 진입 필터는 전부 기본 비활성(코드 주석 참고 — 문헌 근거는 무조건 보유이지
  # 조건부가 아니다. 조건은 표본이 쌓인 뒤 experiments 가 판정한다).
  overnight_drift:
    class: overnight_drift
    # 2026-09-03 소유자 결정: 자동매매는 단타·스캘핑만 — 오버나이트 아이디어는
    # manual_recs 레인으로 텔레그램 추천. 이 전략은 정의 자체가 종가 매수 →
    # 익일 개장 매도(오버나이트 보유)라 대상. 코드·params·capital_fraction은
    # 그대로 둔다(자본 재분배 없음 — 현금 버퍼로 남긴다).
    enabled: false
    symbols: [QQQ] # US ETF 전용 의도 — 레버리지(TQQQ)는 갭 리스크 3배라 제외
    capital_fraction:
      KR: 0.0
      US: 0.15

    validation:
      status: burn_in # 백테스트 표본 0 — 문헌 인용이지 우리 측정이 아니다
    params:
      # 봉 간격 선언(2026-09-03 감사 C4). 실제 봉은 5m(overnight_drift.py `_INTERVAL`).
      # 쿨다운 봉 수는 전역값(risk.cooldown_bars_after_stop: 4) → 5m x 4 = 20분.
      bar_interval_minutes: 5
      entry_before_close_minutes: 5
      exit_after_open_minutes: 5
      stop_pct: 3.0
      target_weight: 0.5
  # ── 병렬 스캘핑 실험 (2026-08-28 소유자 지시) ─────────────────────────
  # "스캘핑 전략을 여러 개 병렬로 돌려서, 계속 돌려봤을 때 수익이 나는 전략을
  # 찾자." capital_mode: per_strategy 라 각자 독립 1,000만원으로 같은 조건에서
  # 출발한다 — 성적 비교의 전제.
  #
  # **이건 N번의 시행이다.** 전략 여러 개를 나란히 돌리면 하나는 우연히 좋아
  # 보인다(490 관측일·100 시행이면 엣지 0 이어도 최고가 연율 샤프 1.81 —
  # quant/backtest/statistics.py). 2026-08-29 대회 확장으로 병렬 레인이 8개다
  # (scalp_1m·pullback_impulse·mr_vwap_quiet·overnight_drift + vol_breakout·
  # intraday_momentum·gap_fade·rsi2_dip). 성적을 볼 때 `strategy-report
  # --trials 8` 로 신고해서
  # Deflated Sharpe 보정을 받아야 한다. 안 하면 "얻어걸린 것"과 "찾아낸 것"을
  # 구분하지 못한다.
  #
  # 둘 다 **5분봉**이다. 실측(1분 절대변동 중앙 8.3bp, 왕복 US 20bp / KR 개별주
  # 30bp)상 1~2분 청산은 구조적으로 진다 — 목표 100~150bp, 보유 20~65분이 필요하다.
  pullback_impulse:
    class: pullback_impulse
    # 근거: 원장 실측 — scalp_1m 손절 건의 **76%(35/46)가 당일 진입가 위로 회복**
    # (중앙 +105bp). 방향은 맞고 진입 지점이 틀렸다는 뜻(파동 고점에서 산다).
    # 같은 신호를 눌림 이후에 산다. 회복폭 중앙 105bp 가 손익분기 목표와 같은 스케일.
    enabled: true
    universe: watchlist
    symbols: []
    capital_fraction:
      KR: 0.0 # KR 개별주는 매도세 20bp 라 왕복 30bp — 스캘핑이 구조적으로 불리
      US: 0.075 # 0.15 → 0.075+0.075 (A/B 기준/촉매 반씩, 2026-09-03 — 합계 불변)

    validation:
      status: burn_in # 신규 — 백테스트 표본 0(Toss 1m 4거래일 롤링). paper 번인이 유일한 검증 경로
    universe_filter:
      # A/B 기준 갈래(2026-09-03) — 촉매 태그가 붙은 종목은 pullback_impulse_cat 이
      # 가져간다. 두 갈래의 종목 집합이 겹치면 원장으로 분리해 채점할 수 없다.
      KR: {exclude_any: [FRGN]} # 단일 요인 — 아래 A/B 헤더 주석의 실측 근거 참고
      US: {exclude_all: [EVENT, TREND]}
    params: &pullback_impulse_params
      # 봉 간격 선언(2026-09-03 감사 C4). 실제 봉은 5m(pullback_impulse.py `_INTERVAL`).
      # 쿨다운 봉 수는 전역값 4 → 5m x 4 = 20분.
      bar_interval_minutes: 5
      min_impulse_bp: 80
      pullback_min_pct: 0.38
      pullback_max_pct: 0.62
      ema_period: 9
      atr_buffer_mult: 0.3
      target_mult: 1.2
      timeout_minutes: 60
      target_weight: 0.5
  pullback_impulse_cat:
    # A/B 촉매 갈래 — 규칙은 위와 **완전히 동일**(params 앵커 공유), 종목만 다르다.
    # 자세한 배경은 아래 scalp_1m_cat 블록 위의 주석에 한 번만 적었다.
    class: pullback_impulse
    enabled: true
    universe: watchlist
    symbols: []
    capital_fraction:
      KR: 0.0
      US: 0.075 # 기준 갈래와 반씩(0.15 분할)
    validation:
      status: burn_in # 새 갈래 — 표본 0. 판정은 `run scoreboard --ab`(양쪽 n>=30 이전엔 판단 불가)
    universe_filter:
      KR: {require_any: [FRGN]} # 외국인 순매수 태그 하나만 — 검증 비용이 가장 싸다
      US: {require_all: [EVENT, TREND]}
    params: *pullback_impulse_params
  mr_vwap_quiet:
    class: mr_vwap_quiet
    # 근거: 고거래량 진입이 오히려 나쁘다는 실측(D+1 스피어만 -0.46, 장중 고RVOL
    # -79.8bp vs 저RVOL -31.3bp). 이 전략은 정반대로 **조용한 종목**만 노린다.
    # "밴드 밖에서 안으로 복귀한 종가"를 요구하므로 고점 추격이 코드 수준에서
    # 불가능하다 — scalp_1m 의 실패 모드가 정의상 재발할 수 없다.
    # 정직한 사전 기대: 문헌이 "스프레드 조정 시 단기 반전의 유의성 급감"을
    # 반복 경고한다 — KR 개별주에서 먼저 죽고 US·KR ETF 에서만 살아남을 수 있다.
    enabled: true
    universe: watchlist
    symbols: []
    capital_fraction:
      KR: 0.0
      US: 0.06

    validation:
      status: burn_in
    params:
      # 봉 간격 선언(2026-09-03 감사 C4). 실제 봉은 5m(mr_vwap_quiet.py `_INTERVAL`).
      # 쿨다운 봉 수는 전역값 4 → 5m x 4 = 20분.
      bar_interval_minutes: 5
      band_k: 2.0
      rvol_max: 1.2
      adx_max: 20
      max_gap_pct: 1.0
      entry_after_open_minutes: 60
      entry_before_close_minutes: 60
      target_min_bp: 60
      timeout_minutes: 75
      max_entries_per_session: 1
      target_weight: 0.5
  # ── 대회 확장 2차 (2026-08-29 소유자 지시) ──────────────────────────────
  # "대회인데 더 다양한 전략을 웹 근거로 다 긁어서 병렬로 — 하락장 전략,
  # 상승장 전략 등을 단타 기준으로." 아래 4개 전부 순수 계약 신규이고 백테스트
  # 표본 0(burn_in) — 문헌 근거와 그 **한계·혼재**는 각 모듈 docstring 에 있다.
  vol_breakout:
    class: vol_breakout
    # Larry Williams 변동성 돌파 — 시가 + k×전일범위 상향 돌파를 추종, 목표 없이
    # 마감 청산. 상승 확장 국면 레인. KR 은 ETF 만(왕복 ~4bp 실측 — 유일한
    # 엣지>비용 venue), US 는 TQQQ.
    enabled: true
    # 122630(KODEX레버리지) 첫날 제외 사유(2026-08-29 검수): 레버리지 배수 조회
    # (stock_info leverageFactor)가 실패하면 헤어컷 없이 비레버리지 취급되어
    # 리스크 예산이 조용히 2배가 된다(assembly.py 부팅 조회 1회 의존) —
    # 확인 완료(06:23 부팅 로그) → 편입. EC2 부팅 로그 "레버리지 확인:
    # 122630=2x"(2026-08-29 06:23)로 조회 성공을 실측 확인했다.
    symbols: ["069500", "122630", "TQQQ"] # KODEX200 / KODEX레버리지 / US 3x
    capital_fraction:
      KR: 0.07 # 0.14 → 0.07+0.07 (A/B 반씩, 2026-09-03). ETF 전용 — 거래세 면제 + KODEX200 스프레드 0.5bp 실측(2026-08-28)
      US: 0.05 # 0.1 → 0.05+0.05

    validation:
      status: burn_in # 문헌 인용(원 공식) — 우리 원장 실측 0
    universe_filter:
      # A/B 기준 갈래(2026-09-03). 이 전략은 관심종목이 아니라 **고정 ETF 바스켓**을
      # 보므로 이 절은 지금 아무것도 버리지 않는다 — 그 ETF 에 촉매 태그가 붙는 날
      # 두 갈래가 같은 종목을 잡는 것을 막는 안전핀이다.
      KR: {exclude_any: [FRGN]} # 단일 요인 — 아래 A/B 헤더 주석의 실측 근거 참고
      US: {exclude_all: [EVENT, TREND]}
    params: &vol_breakout_params
      # 봉 간격 선언(2026-09-03 감사 C4). 실제 봉은 5m(vol_breakout.py `_INTERVAL`,
      # 일봉은 전일 고저 참조용 보조 입력이다). 쿨다운 전역값 4 → 5m x 4 = 20분.
      bar_interval_minutes: 5
      k: 0.5
      min_stop_bp: 40
      eod_exit_min: 5
      target_weight: 0.5
  vol_breakout_cat:
    # A/B 촉매 갈래. **주의 — 이 쌍은 대칭이 아니다**: 기준 갈래는 고정 ETF
    # 바스켓(069500/122630/TQQQ)을 보고, 이 갈래는 관심종목 중 촉매 태그가 붙은
    # 종목을 본다. 즉 "ETF 바스켓 vs 촉매 개별주"의 비교라 유니버스 분할이 아니다.
    # KR 개별주는 왕복 ~30bp 라 위 블록이 "ETF 만"이라고 적어 둔 비용 논리가 여기엔
    # 적용되지 않는다 — 그 비용을 이기는지 자체가 이 갈래가 던지는 질문이다.
    class: vol_breakout
    enabled: true
    universe: watchlist # 기준 갈래와 달리 관심종목을 받는다(촉매 태그가 그 안에만 있다)
    symbols: []
    capital_fraction:
      KR: 0.07 # 기준 갈래와 반씩(0.14 분할)
      US: 0.05 # 기준 갈래와 반씩(0.1 분할)
    validation:
      status: burn_in # 새 갈래 — 표본 0. 판정은 `run scoreboard --ab`
    universe_filter:
      KR: {require_any: [FRGN]} # 외국인 순매수 태그 하나만 — 검증 비용이 가장 싸다
      US: {require_all: [EVENT, TREND]}
    params: *vol_breakout_params
  intraday_momentum:
    class: intraday_momentum
    # SSRN 4824172(Zarattini·Aziz·Barbon 2024) — 시각대별 노이즈 밴드 이탈 방향
    # 추종, SPY 2007~2024 비용 차감 후 Sharpe 1.33. 롱온리 계좌라 하방 신호는
    # SQQQ(인버스) **매수**로 표현한다 — **하락장 레인**이 이 블록이다.
    enabled: true
    symbols: [] # 심볼은 params 의 signal/long/short 3개로 내부 구성(전략이 무시)
    capital_fraction:
      KR: 0.0
      US: 0.09

    validation:
      status: burn_in
    params:
      # 봉 간격 선언(2026-09-03 감사 C4). 실제 봉은 5m(intraday_momentum.py `_INTERVAL`).
      # 쿨다운 봉 수는 전역값 4 → 5m x 4 = 20분.
      bar_interval_minutes: 5
      signal_symbol: "QQQ"
      long_symbol: "TQQQ"
      short_symbol: "SQQQ"
      lookback_days: 14
      # 5 → 3 (배선 시 하향, 2026-08-29): Toss 5분봉 히스토리가 ~4거래일
      # 롤링이라(docs/data-availability.md 실측) 기본 5 로는 **영구히 0건**이
      # 된다 — 배선 검수에서 잡은 "겉으론 돌지만 조용히 죽는" 부류. 3일 σ 는
      # 논문(14일)보다 얕아 밴드 품질이 낮다는 것을 알고 켠다 — 히스토리가
      # 쌓이면 lookback_days=14 로 자연 수렴한다.
      min_lookback_days: 3
      band_mult: 1.0
      stop_pct: 1.5
      min_stop_bp: 40
      max_same_direction_entries_per_day: 2
      flatten_before_close_minutes: 5
      target_weight: 0.5
  gap_fade:
    class: gap_fade
    # 갭하락 되돌림 — 야간-주간 반전 문헌(Della Corte·Kosowski, Akbas 2022) 기반.
    # 단 선물(MNQ) 반증 연구가 있어 **근거 혼재**(모듈 docstring 정직 고지) —
    # 8개 레인 중 가장 약한 근거라는 것을 알고 소액으로 출전시킨다.
    enabled: true
    universe: watchlist
    symbols: []
    capital_fraction:
      KR: 0.0 # KR 개별주 왕복 30bp — 갭 절반 메움 목표와 산수가 빠듯해 US 먼저
      US: 0.06


    validation:
      status: burn_in
    params:
      # 봉 간격 선언(2026-09-03 감사 C4). 실제 봉은 5m(gap_fade.py `_INTERVAL`,
      # 일봉은 전일 종가 참조용 보조 입력이다). 쿨다운 전역값 4 → 5m x 4 = 20분.
      bar_interval_minutes: 5
      gap_min_bp: 100
      gap_max_bp: 400
      entry_window_min: 30
      fill_ratio: 0.5
      atr_buffer_mult: 0.3
      atr_period: 14
      min_stop_bp: 40
      max_hold_min: 120
      flatten_before_close_minutes: 5
      target_weight: 0.5
      # 문헌 필터 3종(2026-09-02, gap_fade.py 상단 docstring "문헌 필터 3종"
      # 절). 원장 실측(9왕복 승률11%, 사실상 전패)과 방향이 일치하는 문헌
      # 근거만 적용 — 0이면 기존 동작(하위호환·실험 롤백 가능).
      rvol_reject_threshold: 2.0 # 고거래량 갭(continuation 우세)은 페이드 제외
      gap_size_reject_bp: 300 # 3% 초과 갭은 제외 — 큰 갭 채움률 8.2%(arXiv:2605.04004)
  rsi2_dip:
    class: rsi2_dip
    # Connors RSI(2) 눌림 매수 — 지수 ETF 과매도(RSI2<10)에 마감 직전 사서 회복
    # (RSI2>60)에 판다. 문헌 승률 75~79%. **오버나이트 보유형**(loop.py
    # _OVERNIGHT_STRATEGIES 등재 — EoD 강제청산 제외). 원전은 손절이 없지만
    # 실계좌 레일로 하드 손절 5% 를 추가했다(모듈 docstring).
    # 2026-09-03 소유자 결정: 자동매매는 단타·스캘핑만 — 오버나이트 아이디어는
    # manual_recs 레인으로 텔레그램 추천. 이 전략은 마감 직전 매수 → 며칠 보유가
    # 전략 정의라 대상. 코드·params·capital_fraction은 그대로 둔다(자본 재분배
    # 없음 — 현금 버퍼로 남긴다).
    enabled: false
    symbols: ["069500", "QQQ"] # KR ETF 4bp venue + US 지수 — 레버리지 제외(갭 리스크)
    capital_fraction:
      KR: 0.08

      US: 0.08

    validation:
      status: burn_in
    params:
      # 봉 간격 선언(2026-09-03 감사 C4). 이 전략은 **일봉 전용**이다(rsi2_dip.py
      # `DataNeeds`가 `(s, "1d", n)`만 요구한다). 쿨다운도 일 단위로 센다.
      bar_interval_minutes: 1440
      cooldown_bars_after_stop: 1 # 1일 x 1봉 = 1거래일
      entry_rsi: 10
      exit_rsi: 60
      entry_before_close_minutes: 10
      trend_sma_days: 200
      max_hold_days: 5
      hard_stop_pct: 5.0
      target_weight: 0.5
  scalp_1m:
    class: scalp_1m
    # 2026-08-18 스펙(docs/superpowers/specs/2026-08-18-scalp-1m-design.md) —
    # news_scalp(A)/intraday_scan(C)와 같은 관심종목 유니버스에서 1분봉 조기
    # 진입 + 부분 익절로 진입 방식만 달리한 병행 전략. quant/trade/strategy/
    # scalp_1m.py 상단 docstring 참고. 태그 게이트 없음(watchlist 유니버스 전체가
    # 대상 — news_scalp/frgn_accumulate와 달리 EVENT_SCALP/FRGN 태그를 읽지 않는다).
    enabled: true
    # (2026-09-02) 아래 값은 `risk.capital_mode: per_strategy`인 지금 **크기를
    # 정하지 않는다** — KR/US 각각 "거래 허용(>0)" 여부만 뜻한다. 실제 1회 진입
    # 규모는 params.target_weight × 전략자본(equal_split)이다. 근거는
    # `risk.capital_mode` 옆 주석 블록 참고.
    capital_fraction:
      KR: 0.075 # 0.15 → 0.075+0.075 (A/B 기준/촉매 반씩, 2026-09-03 — 시장 합계 불변)
      US: 0.09 # 0.18 → 0.09+0.09

    validation:
      status: burn_in # 신규 전략 — 백테스트 표본 없음(Toss 1m 4거래일 롤링). paper 번인이 유일한 검증 경로(스펙 "데이터" 절)
    universe: watchlist
    symbols: []
    universe_filter:
      # A/B 기준 갈래(2026-09-03) — 촉매 태그가 붙은 종목은 scalp_1m_cat 이 가져간다.
      KR: {exclude_any: [FRGN]} # 단일 요인 — 아래 A/B 헤더 주석의 실측 근거 참고
      US: {exclude_all: [EVENT, TREND]}
    params: &scalp_1m_params
      # 봉 간격 선언(2026-09-03 감사 C4). 실제 봉은 1m(scalp_1m.py `_INTERVAL`; 일봉은
      # 세션당 1회 참조하는 보조 입력이다). 선언 전에는 폴백 15m가 적용돼 손절 쿨다운이
      # 60분이었다 — 1분봉 스캘핑에서 그건 하루 대부분을 꺼 두는 것과 같다.
      bar_interval_minutes: 1
      cooldown_bars_after_stop: 15 # 1m x 15봉 = 15분
      # 90 → 0 (2026-08-26 소유자 지시): "단타 스캘핑은 언제든 해도 좋아 — 언제든
      # 시그널을 계속 대기". 0 = 진입창 없음(전 세션 대기). 양수면 개장 후 N분.
      entry_window_minutes_after_open: 0
      # KR 개장 초반 진입 지연(2026-09-02, 원장×문헌 교차확인 — scalp_1m.py 상단
      # docstring "KR 개장 초반 진입 지연 게이트" 절). 원장 실측: KR 08시대
      # 13왕복 승률15% -605,764원 / 09시대 46왕복 승률30% -1,077,172원 —
      # 전체 손실 -163만원 중 -158만원이 이 구간. 문헌(개장 첫 20~30분 변동성
      # 3~4배·진입 승률 38%→54%, arXiv:1005.3535)과 방향이 일치해 적용한다.
      # US는 이 파라미터의 영향을 받지 않는다(코드가 market=="KR"에서만 평가).
      # 0 = 비활성(기존 동작 — 하위호환·실험 롤백 가능).
      kr_entry_open_delay_min: 30
      # 패턴 A — 거래량 서지(스펙: "직전 20봉 평균의 3배 이상인 상승 1분봉")
      volume_surge_mult: 3.0
      volume_surge_lookback: 20
      # 패턴 B — 60선(1분) 지지 허용 오차(스펙: "-0.2%")
      ma_period: 60
      ma_tolerance_pct: 0.2
      # 청산 — 초기 손절 버퍼(스펙: "L1 -0.3%") + 하드캡(스펙: "-3%, 기존
      # news_scalp와 동일한 꼬리 차단")
      stop_buffer_pct: 0.3
      # 3.0 → 1.0 (2026-08-21). 원장 재생 scalp_1m 18건: 현행 평균 -58.0bp/승률
      # 22% → 익절+100·손절-100 평균 -5.1bp/승률 50%. **절반 익절은 오히려
      # 나빴다**(평균 -67.5bp) — 남긴 절반이 마감까지 끌려간다.
      #
      # 재생과 실제의 차이(정직하게): 재생은 손절을 진입가 -100bp 고정으로 뒀지만
      # 실제 손절은 min(근거저점-버퍼, 진입가-100bp)이라 **더 좁을 수 있다**.
      # 더 좁은 손절은 손실은 작지만 손절 횟수는 늘어난다 — 재생과 완전히 같지
      # 않다는 뜻이고, 모의 원장이 판정한다.
      # 1.0 → 2.0 (2026-08-28). **소유자 지적 "손절을 너무 쉽게 한다"가 원장으로
      # 확증됐다**: 손절당한 뒤 당일 진입가 위로 회복한 비율 76%(35/46), 회복 폭
      # 중앙 +105bp · 상위25% +344bp. 손실 건 보유시간 중앙 5.9분 — 진입이 틀린
      # 게 아니라 손절이 1분봉 노이즈에 걸렸다.
      # 반사실(68트립, 종가 판단, 왕복 20bp 차감, 트레일 활성 100bp, 탐색 10회 고지):
      #   손절 100bp 평균 -16.2 · 150bp -5.2 · **200bp +7.7(승률 53%)** · 300bp +10.7
      # 반증 검정: '완전 무청산(마감 보유)'은 -57.3bp — 상승장 인공물이 아니라
      # 손절폭 자체가 문제였다는 뜻이다. 300bp 가 평균은 높지만 최악 -417bp/
      # 하위10% -331bp 로 꼬리가 나빠 200bp 를 택한다(최악 -298bp).
      # **인샘플 반사실이다** — 절대 성과 주장이 아니라 규칙 간 우열 근거이고,
      # 판정은 experiments(DiD)와 스코어보드가 한다.
      stop_hard_cap_pct: 2.0
      # 손절 모드(2026-08-26 구조층 재작업): 구조 기반 — 최근 스윙 저점(지지)
      # 아래 손절, 지지가 안 보이면 진입 금지("손절선을 정할 수 없는 자리"는
      # 그 자체가 위험 정보). ±100bp 고정 브래킷은 세션 내 67%가 양쪽 다
      # 터치했다(2026-08-24 원장 재생 — 노이즈 안). 위 하드캡 1.0% 가 그대로
      # 바닥이라 최대 손실 폭은 종전과 같고(-100bp), 구조가 더 가까우면 더
      # 일찍 나간다 — "잃을 땐 적게".
      stop_mode: structure
      # Williams %R 과열 게이트 — shadow: 진입은 막지 않고 판정만 신호 사유에
      # 실어 표본을 쌓는다(표본이 모이면 block 승격 판단 — trend_gate 관례).
      williams_gate_mode: shadow
      # 절반 익절(스펙: "+1.5R 도달 시 보유의 50% 시장가 실현" — 레리 1:2와
      # 절반 익절 규칙의 절충)
      partial_take_r: 1.5
      partial_fraction: 0.5
      # 전량 익절(2026-08-21 신규 → 2026-08-27 비활성). 100 → 0: 원장 66건
      # 실측에서 승자 실현 중앙 +94bp vs 세션 MFE 중앙 +342bp — 고정 TP 가
      # 상방을 잘랐다. 아래 breakeven_at_bp+trail_bp 조합으로 대체(소유자 지시
      # "이득 볼 땐 많이, 잃을 땐 적게" 2026-08-27).
      take_profit_bps: 0
      # 본전 이동 + 고수위 트레일(2026-08-27 신설, 코드 주석에 실측 전문).
      # 반사실 시뮬(57트립, 종가 판단, 왕복 20bp, 탐색 6회 고지): BE50+트레일70
      # 이 고정 TP100 대비 건당 +8.6bp, 패자 좌측 꼬리(반납형 12/29건) 절단.
      # 기각된 대안(같은 날 실측): ADX/W%R 강제(승자도 차단), 개장 블랙아웃
      # (전 시간대 음수), RVOL>=1.5 필터(고RVOL 이 오히려 -79.8bp), 시간손절
      # 7분(개선 미미). 판정은 experiments(DiD) + 스코어보드가 한다.
      # 50 → 100 (2026-08-28): breakeven_at_bp 는 **트레일 무장 문턱**이기도 하다
      # (이익 구간 전에는 트레일이 구조 손절을 건드리지 않는다 — scalp_1m.py
      # `_manage_position` 주석의 실거래 확증 참고). 위 반사실에서 활성 100bp 가
      # 같은 손절폭에서 50bp 보다 승률이 높았다(200bp 손절 기준 53% vs 44%).
      breakeven_at_bp: 100
      trail_bp: 70
      flatten_before_close_minutes: 1
      # 프리마켓(KR NXT 08:00~08:50, US ET 08:00~09:25 — 2026-08-18 대칭 확장)
      # — scalp_1m.py 상단 docstring "프리마켓" 절. 관찰 입력(정규장 가속)은 이
      # 플래그와 무관하게 항상 동작한다 — premarket_entry는 "직접 진입"(2번)만
      # 켜고 끈다. 직접 진입 신호는 `risk.extended_sessions.scalp_1m`(KR/US
      # 둘 다 등록됨, 위 risk 섹션)을 통과해야 실제 주문이 된다 — 등록 안 된
      # (전략, 시장) 조합은 risk.manager.RiskManagerImpl.approve()의
      # is_market_open 게이트에서 여전히 막힌다.
      premarket_entry: true
      premarket_min_volume_krw: 50000000 # 분당 최소 거래대금(원) 가드(KR) — NXT 프리마켓 얇은 유동성 방어
      # 분당 최소 거래대금(달러) 가드(US). $50k 는 백테스트 최적값이 아니라
      # KR(5천만원≈$36k)과 같은 자릿수의 보수적 기본값 — US 프리마켓은 스프레드가
      # KR NXT보다 넓을 수 있어 조금 더 여유를 뒀다. 실측 근거 없음, paper 번인으로
      # 재조정한다.
      premarket_min_volume_usd: 50000
      # 일봉 추세/변동성 게이트(2026-08-19, QuantConnect #407/#478 필터 이식 —
      # scalp_1m.py 모듈 docstring "일봉 추세/변동성 게이트" 절).
      # KR/US 대칭 적용, 일봉 조회 실패 시 게이트 통과(기존 동작 보존).
      #
      # shadow(기본) = 판정만 계산해 신호 사유·저널에 남기고 **진입은 막지 않는다**.
      # 도입 직후 08-18 실제 진입 전수 소급 측정에서 이 게이트는 그날 최대 손실도
      # 못 걸렀고 소폭 승자도 함께 막았다(표본 1일) — "켜면 나아진다"는 근거가
      # 없으므로 근거가 쌓일 때까지 관측만 한다. 저널의 `[게이트:차단후보 ...]`
      # 표기와 실제 손익을 n≥30 에서 대조해 block 승격을 판단한다.
      # block = 게이트 미충족 시 진입 차단 / off = 계산 자체를 하지 않음.
      trend_gate_mode: shadow
      adx_min: 25.0 # QuantConnect #407(Cross-Sectional Momentum with Trend Filter) 근거값 — 이 저장소 실데이터로 검증되지 않음
      max_atr_ratio: 0.10 # QuantConnect #478(Quantum Walk BQP) 변동성 억제기 근거값 — 이 저장소 실데이터로 검증되지 않음
  # ── A/B: 촉매 갈래 (2026-09-03 소유자 지시) ─────────────────────────────
  # 질문 하나에 원장으로 답하기 위한 배치다: **"뉴스·수급 촉매가 붙은 종목만
  # 매매하면 실제로 더 버는가?"** 같은 전략 클래스를 두 갈래로 나란히 돌린다.
  #   기준 `<id>`      = 촉매 태그가 붙은 종목을 **뺀** 나머지 (before)
  #   촉매 `<id>_cat`  = 촉매 태그가 붙은 종목만            (after)
  # 두 갈래의 종목 집합은 `universe_filter` 로 **겹치지 않게** 갈라 놓았다 — 그래서
  # 원장의 strategy_id 만으로 비교가 성립한다(`run scoreboard --ab`, 양쪽 n>=30
  # 전에는 "판단 불가"라고만 답한다).
  # 촉매의 정의는 시장마다 다르다.
  #   KR = **외국인 수급(FRGN) 단일 요인**. 실측(3,112 종목일): foreign_net>0 인
  #        종목의 D+1 시가→종가가 foreign_net<0 대비 **+37bp/일**(t=1.86, 25일 중
  #        14일 양수) — 우리가 가진 단일 요인 중 가장 유망하다. 복합 게이트
  #        (EVENT+FRGN)는 종목이 줄어 판정에 140거래일 이상 걸리는데, 단일 요인은
  #        **~56거래일**이면 된다. 그래서 **싼 것부터** 검증한다 — EVENT+FRGN
  #        복합 갈래는 이 결과를 본 뒤의 다음 실험이다.
  #        FRGN 태그를 붙이는 주체는 own_brief.sh 다(data/ledger/frgn_flow.jsonl →
  #        foreign_trend.classify → watch-add --tags). 이 A/B 는 **그 태그를 있는
  #        그대로** 잰다 — 분류 규칙이 바뀌면 재는 대상도 같이 바뀐다.
  #   US = 뉴스(EVENT) + 추세(TREND). 외국인 수급 데이터 자체가 없다.
  #
  # **params 는 YAML 앵커로 공유한다**(`*scalp_1m_params`). 진입 규칙이 한 글자라도
  # 다르면 이건 A/B 가 아니라 서로 다른 두 전략의 비교다 — 그 사고를 파일 수준에서
  # 막는다. 주의: 거버너가 `strategies.scalp_1m.params.*` 를 튜닝하면 오버레이
  # (auto_params.yaml)는 id 단위라 **기준 갈래에만** 얹힌다. 튜닝이 실반영되면 촉매
  # 갈래에도 같은 값을 손으로 넣거나 실험을 접어야 한다 — 안 그러면 비교가 오염된다.
  #
  # ADR-0007("config 별칭 다중 인스턴스 금지")의 **의도적 예외**다. 그 금지는
  # 파라미터만 다른 전략 동물원(donchian_apex_vm17...)을 막으려는 것이고, 여기는
  # 파라미터가 동일하고 유니버스만 다른 **기한이 있는 실험**이다 — 판정이 나면
  # 한쪽을 지운다(quant/trade/strategy/CLAUDE.md 의 같은 항목에도 적어 뒀다).
  scalp_1m_cat:
    class: scalp_1m
    enabled: true
    capital_fraction:
      KR: 0.075 # 기준 갈래와 반씩(0.15 분할)
      US: 0.09 # 기준 갈래와 반씩(0.18 분할)
    validation:
      status: burn_in # 새 갈래 — 표본 0. 판정은 `run scoreboard --ab`
    universe: watchlist
    symbols: []
    universe_filter:
      KR: {require_any: [FRGN]} # 외국인 순매수 태그 하나만 — 검증 비용이 가장 싸다
      US: {require_all: [EVENT, TREND]}
    params: *scalp_1m_params
  # ── LLM 트레이더 (2026-08-30 소유자 승인) ────────────────────────────────
  # "LLM 자체에게 전략과 판단을 맡기는 게 하나의 전략이 되는 것, 똑같이
  # 1,000만원 모의, 기존 시스템 위에, 한 달 테스트." 12번째 참가자 — 다른 11개는
  # 사람이 정한 규칙(돌파·평균회귀·모멘텀 등)의 코드화이고, 이것만 규칙 자체를
  # LLM 판단에 맡긴다. LLM 판단 프로세스는 별도(server/ 소관, 이 저장소 밖)이고,
  # 결정은 data/state/llm_trader_inbox.jsonl 에 append된다 — 엔진은 읽기만 한다
  # (거래 핫패스에 LLM 호출 없음, 루트 CLAUDE.md "절대 하지 말 것"). 상세 계약·
  # 가드레일은 quant/trade/strategy/llm_trader.py 모듈 docstring.
  llm_trader:
    class: llm_trader
    enabled: true
    symbols: [] # 인박스가 유니버스를 대신한다 — universe: watchlist 가 아니다
    capital_fraction:
      KR: 0.08 # KR 전용 — 인박스가 KR 6자리 심볼만 받는다(llm_trader.py 가드레일 1번)
      US: 0.0
    validation:
      status: burn_in # 신규 실험 레인 — 백테스트 표본 0(LLM 판단은 리플레이 불가). paper 번인이 유일한 검증 경로, 한 달 테스트(소유자 지시)
    params:
      # 봉 간격 선언(2026-09-03 감사 C4). 이 전략은 봉을 안 보고 인박스 행 + 시세로만
      # 판단하지만, 인박스는 분 단위로 들어온다 — 쿨다운의 자연 단위를 1분으로 둔다.
      bar_interval_minutes: 1
      cooldown_bars_after_stop: 15 # 1m x 15봉 = 15분
      max_positions: 5
      max_weight_per_position: 0.34
      stop_pct: 5.0
  # ── 문헌 기반 일중 전략 3종 (2026-09-03) ─────────────────────────────────
  # 셋 다 롱 온리·당일 청산(오버나잇 금지)·KR 우선. **전부 enabled: false 로
  # 등록만 한다** — 오늘 밤 백테스트를 돌려 통과한 것만 사람이 켠다. 그래서
  # 활성 전략 명단(tests/test_strategy_registry_new_branches.py)과 자본 레인
  # 명단(tests/test_validation_gate.py)은 바뀌지 않는다.
  # 근거 논문/실증은 각 모듈 docstring 상단에 출처와 **한계까지** 적어 뒀다:
  # quant/trade/strategy/{orb_rvol,eod_reversal,open_reversal}.py
  #
  # ① 개장 레인지 돌파 + 개장 상대거래량(rvol) 선별
  #    Zarattini, Barbon & Aziz (2024) "Stocks in Play". 논문 성과는 in-sample
  #    이고 손절(0.10×ATR14)이 우리 왕복 비용(≈20bp)보다 얕을 수 있다 —
  #    min_stop_bp 는 첫 측정을 훼손하지 않으려고 0(비활성)으로 둔다.
  orb_rvol:
    class: orb_rvol
    enabled: false
    capital_fraction:
      KR: 0.05
      US: 0.05 # 논문 자체가 미국 주식 실증이라 US 도 같이 잰다
    validation:
      status: burn_in # 표본 0 — 백테스트 후 사람이 켠다
    universe: watchlist
    symbols: []
    params:
      bar_interval_minutes: 1 # 쿨다운의 자연 단위(실제 판단봉은 5m — 개장 레인지 1봉)
      cooldown_bars_after_stop: 15 # 1m x 15봉 = 15분
      rvol_days: 14 # 직전 14세션의 같은 개장 5분봉 거래량 평균이 분모
      rvol_min: 1.0
      top_k: 5 # rvol 상위 5종목만 그날의 stocks in play (시장별)
      entry_window_min: 60
      stop_atr_frac: 0.10 # 손절 = 진입가 - 0.10 x ATR14(일봉)
      atr_period: 14
      avg_volume_days: 14
      doji_body_frac: 0.10 # |종가-시가| < 10% x 레인지면 방향 없음으로 제외
      min_rvol_sessions: 5 # 기준일이 이보다 적으면 그 종목은 그날 건너뛴다
      min_stop_bp: 0 # 0=비활성. 왜 40 이 아닌지는 모듈 docstring "논문 숫자" 2번
      min_price:
        KR: 1000 # 논문의 US $5 필터와 그 KR 대응(우리 추정)
        US: 5
      min_avg_volume:
        KR: 100000 # 주식 수 기준(논문은 달러 거래대금 — 모듈 docstring 한계 5번)
        US: 1000000
      eod_exit_min: 3
      target_weight: 0.5
  # ② 장 막판 일중 반전 — 그날 밀린 종목을 마감 45분 전에 사서 종가에 판다.
  #    Baltussen/Da/Soebhag (2024) 계열 일중 수익률 분해 + KOSPI 일중 반전 실증.
  #    KR 전용(거래대금 밴드가 원 단위다). 효과가 큰 구간이 곧 슬리피지가 큰
  #    구간이라 유동성 밴드가 이 전략의 생사다 — 두 값은 문헌이 아니라 우리 추정.
  eod_reversal:
    class: eod_reversal
    enabled: false
    capital_fraction:
      KR: 0.05
      US: 0.0 # 거래대금 밴드가 KRW 라 US 는 의미가 없다(params.markets 도 KR 전용)
    validation:
      status: burn_in
    universe: watchlist
    symbols: []
    params:
      bar_interval_minutes: 1
      cooldown_bars_after_stop: 15
      eval_minutes_before_close: 45
      bottom_pct: 20.0 # 세션 수익률 하위 20%
      min_drop_pct: 1.5
      min_turnover_krw: 100000000 # 1억원 — 체결이 되는가
      max_turnover_krw: 100000000000 # 1,000억원 — 효과가 남아 있는가
      stop_pct: 1.5
      eod_exit_min: 2
      target_weight: 0.5
      markets: [KR]
  # ③ 전일 패자 개장 매수 — 국내 단기 반전 문헌(KCI 2023 + KAIST 야간/일중 분해).
  #    ②와 형제지만 노리는 효과가 다르다(하루를 건너뛴 일간 반전).
  open_reversal:
    class: open_reversal
    enabled: false
    capital_fraction:
      KR: 0.05
      US: 0.0 # 근거 문헌이 국내 실증 — US 는 재지 않는다
    validation:
      status: burn_in
    universe: watchlist
    symbols: []
    params:
      bar_interval_minutes: 1
      cooldown_bars_after_stop: 15
      entry_window_min: 15 # 개장 후 15분 안에서만
      bottom_k: 3
      min_prev_drop_pct: 2.0
      max_gap_down_pct: 3.0 # 이보다 더 갭하락이면 떨어지는 칼 — 진입하지 않는다
      stop_pct: 2.0
      eod_exit_min: 3
      target_weight: 0.5
      daily_bars: 10
  # ④ 15분봉 추세일 지속(2026-09-04) — 1분·5분 아이디어가 전부 왕복 비용에 죽은 뒤
  #    "거래당 크기를 키운다"는 방향으로 만든 첫 15분봉 전략. **스크리닝을 통과하지
  #    못했다**: US 400종목 1분봉(2024-09~2026-08, 왕복 25.2bp) 실측에서 상승 국면
  #    총 엣지 +3.2bp, 하락 국면 -30.1bp — 국면 게이트는 소유자 직관대로 작동하지만
  #    좋은 쪽조차 비용의 1/3 이다(quant/trade/strategy/trend_day.py 모듈 docstring
  #    "실측 결과를 먼저 밝힌다"). 코드·측정 기준점으로만 남긴다.
  #    **켜기 전 조건**: 비용이 내려가거나 더 강한 선별이 붙어 스크리닝을 다시
  #    통과해야 한다. 그 근거 없이 enabled 를 true 로 바꾸지 마라.
  trend_day:
    class: trend_day
    enabled: false
    capital_fraction:
      KR: 0.0 # 실측이 US 400종목뿐이다 — KR 은 재지 않았으므로 자본을 주지 않는다
      US: 0.05
    validation:
      status: burn_in
    universe: watchlist
    symbols: []
    params:
      bar_interval_minutes: 15
      or_minutes: 30 # 개장 레인지 길이(15의 배수여야 한다 — 봉 경계)
      or_atr_mult: 0.8 # 개장 레인지 > 0.8 x ATR14 인 날만 "추세일"로 본다
      stop_atr_mult: 0.25 # 손절 = 진입 시점 세션 VWAP - 0.25 x ATR14 (진입가 기준이 아니다)
      atr_period: 14
      avg_volume_days: 14
      regime_ma_days: 20 # 대리 지수 일봉 20일선 위일 때만 진입
      require_gap_up: true # 당일 시가 >= 전일 종가
      regime_symbols:
        KR: "069500"
        US: "QQQ"
      entry_window_min: 330 # 개장 후 5.5시간까지만 — 마감 직전 진입은 왕복 비용만 낸다
      min_price:
        KR: 1000
        US: 5
      min_avg_volume:
        KR: 100000 # 주식 수 기준(orb_rvol 과 같은 한계 — 거래대금이 아니다)
        US: 1000000
      eod_exit_min: 3
      target_weight: 0.5
      min_stop_bp: 40 # VWAP 기준 손절은 원래 넓다 — 이 게이트가 걸리면 그날은 추세일이 아니다
  # ── 레버리지 ETF 페어 전환(2026-09-05, Family F1 — scratchpad/letf_spec.md) ──
  # 지수/섹터 3배 ETF 페어를 신호 심볼의 EMA/VWAP 추세 방향으로 갈아탄다. 독립
  # 백테스터(quant-backtest 저장소)가 **같은 규칙을 별도로 구현**해 거래 단위로
  # 교차검증한다(스펙 "Cross-check protocol") — 그 결과(walk-forward OOS·deflated
  # Sharpe·비용 2배 생존)가 나오기 전까지 두 블록 다 `enabled: false`,
  # `capital_fraction` 양 시장 0(자본 배정은 게이트 통과 후 소유자가 정한다).
  letf_pair_qqq:
    class: letf_pair
    enabled: false
    symbols: [] # 전략이 params의 signal/long/short 3개로 내부 구성(전략이 무시)
    capital_fraction:
      KR: 0.0
      US: 0.0 # 게이트 통과 전 — 위 헤더 주석 참고
    validation:
      status: burn_in
    params: &letf_pair_params
      # F1 스펙 기본값(scratchpad/letf_spec.md "Defaults") 그대로 — 튜닝 없음.
      bar_interval_minutes: 15 # DECLARE(리스크 쿨다운 봉 간격용) — interval_minutes(M)와 같아야 한다(생성자가 대조)
      interval_minutes: 15
      n_fast: 8
      n_slow: 21
      n_atr: 14
      k_min: 0.25
      stop_atr_mult: 1.5
      trail_atr_mult: 0 # 0 = 비활성(기본)
      # 손절/익절 규칙 확장(2026-09-05, 소유자 청산 규칙). 전부 기본값(atr 모드,
      # 사다리 꺼짐)이라 이 블록만 봐서는 동작이 하나도 안 바뀐다 — 켜려면 아래
      # 값들을 명시적으로 고칠 것(letf_pair.py 모듈 docstring "익절 사다리" 절).
      stop_mode: atr # atr(기본, stop_atr_mult 산식) | pct(stop_pct 고정 비율)
      stop_pct: 0.03 # stop_mode: pct일 때만 쓰인다
      tp1_pct: 0 # 0 = 비활성. 예: 0.03(1단계 +3%에서 부분 익절)
      tp1_fraction: 0.5 # 1단계에서 청산할 비중
      tp2_pct: 0 # 0 = 비활성. 예: 0.05(2단계 +5%에서 잔량 전량 익절)
      tp_atr_mult: 0 # 0 = 비활성. tp1_pct 대신 ATR 스케일로 사다리를 정의(둘은 동시 설정 불가)
      # tp_floor_exit: 선언하지 않음 — 사다리가 켜지면 코드가 자동으로 true로
      # 기본값을 바꾼다(letf_pair.py 생성자 `_ladder_active` 참고). 명시적으로
      # 끄고 싶을 때만 여기 `false`를 추가할 것.
      tp_floor_to_entry: false # 1단계 체결 후 손절선을 진입가로 올릴지
      min_stop_bp: 40
      warmup_min: 30
      no_entry_min: 30
      eod_exit_min: 5
      cooldown_bars: 2
      # 리스크 층의 손절 후 쿨다운(risk.cooldown_bars_after_stop 전역 4봉 = 15m×4 = 60분)이
      # 전략의 cooldown_bars(2봉)보다 길면 엔진이 재진입을 막아 백테스터(qb/letf)와
      # 거래 단위 대조가 어긋난다 — 같은 값으로 선언해 두 층을 일치시킨다.
      cooldown_bars_after_stop: 2
      max_entries_per_day: 3
      switch: true
      exit_on_neutral: false
      day_filter: false
      gap_min: 0.005
      or_atr_min: 0.8
      overnight: false # true 변형은 연구용(스펙 "overnight=true variant") — 기본 배포는 항상 false
      target_weight: 0.5
      signal_symbol: "QQQ"
      long_symbol: "TQQQ"
      short_symbol: "SQQQ"
  letf_pair_sox:
    # SOXX → SOXL/SOXS 병행 갈래 — 규칙은 letf_pair_qqq와 완전히 동일(params
    # 앵커 공유 + signal/long/short만 YAML 병합 키로 override), 유니버스(반도체
    # 섹터)만 다르다. `_cat` A/B 갈래와 달리 이건 서로 다른 신호 심볼을 매매하는
    # 별개의 레인이다(같은 종목을 놓고 갈리는 A/B가 아니다).
    class: letf_pair
    enabled: false
    symbols: []
    capital_fraction:
      KR: 0.0
      US: 0.0
    validation:
      status: burn_in
    params:
      <<: *letf_pair_params
      signal_symbol: "SOXX"
      long_symbol: "SOXL"
      short_symbol: "SOXS"

risk:
  # 확장 세션 허용 목록 (2026-08-18, 사용자 결정: 프리마켓 직접 진입 찬성).
  # 정규장 밖 주문은 원래 전부 차단인데, 여기 명시된 (전략, 시장, 시각 창)만
  # 통과한다 — KR 프리마켓(NXT 08:00~08:50)은 Toss 1m 봉 실측으로 체결이
  # 실재하는 세션이다. **시각은 그 시장의 현지 시각**이다(risk/manager.py
  # `_MARKET_TZ` — KR=KST, US=America/New_York, DST 안전 판정).
  # US 프리마켓(2026-08-18 대칭 확장) — Toss 1m 봉 실측(SOXL, EC2 2026-08-18):
  # ET 04:00~09:30(프리마켓 전 구간)에서 연속 1분봉·실거래량 확인됨(예:
  # 08-17 17:0x ET대 300주대~1만주대). 04:00 전체가 아니라 개장 직전
  # 유동성 있는 마지막 90분만 인정 — 스펙 근거는 scalp_1m.py 모듈 docstring
  # "프리마켓" 절 참고. scalp_1m·KR·US 이 조합들만, 나머지 8개 전략×시장은
  # 기존 게이트 그대로다(risk/manager.py _in_extended_session).
  extended_sessions:
    scalp_1m:
      KR: ["08:00-08:50"]
      US: ["08:00-09:25"]
  # 전략별 독립 명목계정(2026-08-19 활성화, 모의투자 전용 — 사용자 직접 지시).
  # per_strategy = 전략마다 per_strategy_initial_krw(1,000만원)씩 완전히 분리된
  # 가상 계좌를 준다 — "총 1,000만원을 지분으로 나누는 게 아니라 전략마다 따로
  # 노는" 모드. 목적은 paper 중 전략별 성장곡선을 서로 간섭 없이 비교하는 것.
  # **코드 기본값은 shared**(RiskManagerImpl — 이 키가 없으면 계좌 전체 자산을
  # capital_fraction/cash_pct로 나누는 지금까지의 실서비스 방식이 100% 보존된다).
  # 실계좌 전환 시에는 이 줄을 `capital_mode: shared`로 되돌리기만 하면 된다
  # (capital_fraction 블록은 지우지 않는다 — per_strategy 모드에서 참조하지
  # 않을 뿐, shared로 돌아가면 그 값들이 즉시 다시 쓰인다).
  capital_mode: per_strategy # shared | per_strategy — 코드 기본값은 shared
  #
  # 2026-09-03 — **`strategies.*.capital_fraction`은 더 이상 유령 노브가 아니다.**
  # (아래 capital_policy: declared 로 전환하면서 해결. 이 주석은 그 이전 상태를
  #  설명하던 2026-09-02 경고를 대체한다.)
  #   1. 게이트 의미는 그대로다 — `capital_fraction[market] <= 0`이면 그 (전략,
  #      시장) 신규 진입 차단(risk/manager.py `_capital_fraction_for`).
  #   2. **크기 의미가 돌아왔다** — `capital_policy: declared`가 전략의 시작
  #      명목자본을 `KRW풀 x fraction[KR] + USD풀(KRW환산) x fraction[US]`로
  #      정한다(assembly.py `declared_initial_krw`). 즉 "scalp_1m US 0.18"은
  #      이제 실제로 USD 풀의 18%다.
  #   3. 진입 크기는 그 위에서 `strategy_equity x signal.target_weight x
  #      risk_multiplier x 레버리지 헤어컷`이다. 크기를 더 잘게 조절하려면
  #      `params.target_weight`를, 전략 간 배분을 바꾸려면 여기 fraction을 만진다.
  # 한 시장의 fraction 합이 1.0을 넘으면 그 시장만 비례 축소되고 WARNING이 뜬다
  # (초과 배분 = 존재하지 않는 현금 = 의도치 않은 레버리지). `capital_mode: shared`
  # 로 되돌려도 값의 크기가 사이징에 쓰이는 것은 동일하다.
  # capital_policy(2026-08-19 Phase B, 실전 전환의 다리). capital_mode:
  # per_strategy에서만 의미가 있다.
  # - fixed(기본, 코드 기본값도 fixed) = 지금 동작 그대로: 전략마다
  #   per_strategy_initial_krw(아래) 고정. 명목 합계가 실계좌를 넘어도 된다
  #   (모의투자 중 전략별 성장곡선 비교용).
  # - equal_split = 실전 전용: **실제 총현금 ÷ 활성 전략 수**로 전략마다 시작
  #   명목자본을 정한다. 명목 합계가 실계좌와 정확히 일치해 전략별 현금
  #   게이트가 진짜 게이트가 된다. 새로 추가된 전략만 그 시점의 최신 분모를
  #   받고, 이미 굴러간 전략의 시작금은 재조정되지 않는다(장부 생성 시점에
  #   한 번만 못박힘 — quant/trade/risk/books.py `_ensure` 참고).
  # - declared(2026-09-03) = equal_split과 **같은 총현금**을 쓰되 똑같이 나누지
  #   않는다: 전략의 시작 명목자본 = `KRW풀 x capital_fraction[KR]
  #   + USD풀(KRW환산) x capital_fraction[US]`. 시장별 풀로 나누는 이유는 실제
  #   지출 한도가 통화별 지갑이기 때문이다 — 총현금 하나에 곱하면 KR 비중이
  #   존재하지 않는 USD를 포함한 금액이 되어 명목은 크고 지갑은 비는 어긋남이
  #   생긴다. 양 시장 모두 비중이 있는 전략(scalp_1m KR .15 / US .18,
  #   rsi2_dip .08/.08)은 두 풀의 몫을 합산한다. 양 시장 모두 0인 전략은 장부
  #   자체를 만들지 않는다(어차피 진입이 차단된다).
  # 2026-09-01: 실계좌 스냅샷 이식(seed-real) 이후 fixed(전략당 고정 1,000만원)는
  # 새 현실(실제 KRW 현금 ~300만원 + 005930 보유, USD 현금 ~$6.2k)과 충돌한다 —
  # 활성 전략이 여럿이면 명목 합계가 실제 자산의 몇 배가 되어 전략별 현금 게이트가
  # 이름뿐인 상한이 된다. 그래서 먼저 equal_split(원래 "실전 전환의 다리"로 설계된
  # 값)으로 갔다.
  # 2026-09-03: equal_split → declared. equal_split은 명목 합계는 맞췄지만
  # **선언과 실행을 분리시켰다** — 12개 전략이 전부 1/12씩 받으면서
  # capital_fraction의 크기 정보가 통째로 죽었고, 설정 파일이 사실과 다른 말을
  # 하게 됐다(위 2026-09-02 경고가 그 상태를 기록한 것이다). declared는 그
  # 선언을 그대로 집행한다 — "scalp_1m에 US 18%"라고 써 놓았으면 실제로 18%다.
  capital_policy: declared # fixed | equal_split | declared — 코드 기본값은 fixed
  per_strategy_initial_krw: 10000000 # capital_policy: fixed 로 되돌릴 때만 쓰는 값(지금은 미사용)
  # 사이징 기준. capital_fraction(기본) = target_weight x 전략자본(=capital_fraction x 총자산).
  # cash_pct = target_weight x **그날 실제 가용 현금**(브로커 buying-power).
  # 사용자가 같은 계좌에서 손으로도 매매하므로 실계좌에서는 cash_pct가 맞다 —
  # 현금이 줄면 엔진도 자동으로 작게 들어간다. 백테스트 결과와의 비교 가능성을
  # 유지하려면 capital_fraction으로 두고 비교할 것.
  sizing_mode: capital_fraction # capital_fraction | cash_pct
  max_position_pct: 50 # 전략 자본 대비 단일 포지션 상한 (capital_fraction 모드 전용)
  max_symbol_pct_total: 60 # 종목별 총자산 대비 상한
  daily_loss_limit_pct: 3 # 일 손실 한도 — 도달 시 당일 신규 진입 중단
  # 코드 버그와 무관하게 작동하는 회로차단기 — 브로커가 포지션 메타를 잃어 10초마다
  # 절반씩 매도하던 상태 폭주 사고 이후 추가(quant-expert SKILL.md §5). 전부 청산은
  # 절대 막지 않는다 — 청산을 막으면 손실 포지션을 가두는 꼴이라 더 위험하다.
  # 2026-08-10 리스크 감사로 30 유지: orb_scan은 종목당 최대 2주문이고 총노출 캡이
  # 동시 4종목에서 막아 실측 상한 ~8주문 — 30은 정상 거래일에 걸린 적이 없다.
  # (한때 50으로 올렸다가 감사에서 근거 오류로 판정, 되돌림)
  # 0 = 비활성 (2026-08-14 사용자 판단). 실측 4거래일: 시장별 하루 진입 최대 9건이라
  # 30 상한은 정상 진입을 막은 적이 없다. 그리고 하루 총량은 "시그널이 많은 날"과
  # "버그 난 루프"를 구분하지 못한다 — 많이 잡히는 날을 묶으면 벌 때 적게 벌게 된다.
  # 폭주 방어는 아래 반복 진입 레일이 맡는다(그게 실제 사고의 모양이다).
  max_orders_per_day: 0
  # 같은 (종목, 전략)이 이 창 안에서 이만큼 반복 진입하면 차단. 0 = 비활성.
  # 2026-08 폭주(10초 폴링마다 재발동)는 30초 안에 걸린다. 반대로 여러 종목이 바쁜
  # 날은 절대 걸리지 않는다 — 총량 상한과 다른 점이 이것이다.
  max_repeat_entries_per_window: 3
  repeat_entry_window_minutes: 5
  # 이보다 작은 주문은 내지 않는다(원). 2026-08-11 실운영에서 명목 181원짜리
  # 주문이 체결돼 −7원 손실이 스코어보드에서 33,000원 손실과 같은 1표로 집계됐다.
  # 0 = 비활성.
  min_order_notional_krw: 30000
  # 손절 청산 후 **그 (종목, 전략)의** 신규 진입을 N봉 차단한다. 2026-09-03(감사 C4)
  # 이전에는 종목만이 키였다 — scalp_1m이 005930에서 손절하면 close_bet도 그날 그
  # 종목에 못 들어갔다. 쿨다운의 근거는 "이 전략의 그 신호가 휩소였다"이지 "이 종목이
  # 나쁘다"가 아니므로, 다른 논지로 보는 다른 전략까지 막을 이유가 없다.
  #
  # ## 실효 쿨다운(= 봉 간격 x 봉 수) — 2026-09-03
  # 아래 4는 **15분봉을 전제로 고른 숫자**(=1시간)였는데, 그 전제가 이미 무너져 있었다:
  # 활성 전략 중 봉 간격을 선언한 전략이 하나도 없어 전부 폴백 15분으로 해석됐고,
  # 결과적으로 "모두 60분"이 됐다 — 그건 결정이 아니라 폴백의 사고였다. 이제 각 전략이
  # `params.bar_interval_minutes`로 실제 봉을 선언하고, 필요하면 같은 자리에서
  # `params.cooldown_bars_after_stop`으로 봉 수를 덮어쓴다.
  #   1m 전략 (scalp_1m / news_momentum / close_bet / llm_trader):  1m x 15봉 =   15분
  #   5m 전략 (pullback_impulse / intraday_momentum / mr_vwap_quiet /
  #            vol_breakout / overnight_drift / gap_fade):          5m x  4봉 =   20분
  #   일봉 전략 (rsi2_dip / frgn_accumulate):                       1d x  1봉 = 1거래일
  cooldown_bars_after_stop: 4 # 전략별 선언이 없을 때의 전역 기본값(5분봉 전략들이 이 값을 쓴다)
  # 전략을 못 찾았을 때만 쓰는 봉 간격 폴백(분). 전략이 선언한 값이 항상 우선한다.
  cooldown_bar_interval_minutes: 15
  # 손절 후 **당일 전체** 재진입 차단(2026-08-28 소유자 지시 실측 반영, 전략 단위).
  # scalp_1m 원장: 손절 후 같은 심볼 재진입 승률 14%/평균 -40.9bp vs 이익 후
  # 재진입 승률 43%/-17.3bp — 이익보호 청산은 '손절' 마커가 없어 기록되지 않으므로
  # 이익 후 재진입은 계속 열려 있다. 대상 전략만 나열(빈 목록 = 무동작).
  # 2026-08-28 아침 소유자 반론으로 **비활성화**(엔진 재시작 전이라 한 번도
  # 가동되지 않았다): "좋은 종목에 타점을 못 잡을 수도 있다. 순간적 손절이면
  # 차라리 재진입·추가매수가 낫다." 내 근거는 n=7(손절 후 재진입 승률 14%)로
  # 너무 얇았고, 같은 날 더 강한 반대 증거가 나왔다 — 손절당한 종목의 76%가
  # 당일 진입가 위로 회복했다. 즉 문제는 재진입이 아니라 **손절폭**이었다
  # (stop_hard_cap_pct 주석). 코드와 테스트는 남긴다(빈 목록 = 무동작).
  cooldown_until_eod_strategies: []
  max_order_notional_pct: 60 # 단일 주문 금액이 자산의 이 비율을 넘으면 거부(팻핑거 가드)
  # --- 포트폴리오 레벨 상한 (다종목 전용, 위 종목별 상한과 다른 축) ---
  # max_position_pct는 **종목마다** 적용된다. 1~2종목일 땐 그것이 사실상 총노출
  # 상한이었지만, 상위 100종목에서 신호를 받으면 신호 20개 x 50% = 자본의 1,000%를
  # 배분하려 든다. 아래 둘이 그것을 막는다. 둘 다 **청산은 절대 막지 않는다.**
  max_total_exposure_pct: 100 # 보유 명목 합계 상한(자산 대비). 증거금·이자를 모델링하지 않으므로 100 = 무레버리지
  # 주의(리스크 감사 실측): 포지션당 명목이 max_position_pct에 포화되면 100%/25% = 4종목에서
  # 총노출 캡이 먼저 걸린다 — 이 값(10)은 현 설정에선 도달 불가능한 상한이다.
  max_concurrent_positions: 10
  # 레버리지 ETF(TQQQ/SOXL 등, |lev|>1) 전용 총노출 상한. TQQQ·SOXL·SPXL은 상관계수
  # 0.9+라 max_concurrent_positions만으로는 분산이 안 된다 — 3배 상품 3종목이면
  # 실질 9배 단일 팩터 노출이다. leverage_of(부팅 시 stock_info로 조회)가 없으면
  # 이 레일은 판정 불가로 완전히 비활성(백테스트/테스트 영향 없음). 0 = 비활성.
  max_leveraged_exposure_pct: 50
  # 전략 간 합산 노출 감시(2026-08-30, 관측+경고 — 자동 차단 아님). 위 두 상한은
  # capital_mode: per_strategy에서 전부 그 전략의 독립 장부 기준이라, 다른
  # 전략이 이미 같은 심볼을 들고 있거나(중복 보유) 레버리지 ETF 롱 + 그
  # 인버스 롱을 동시에 들고 있어도(TQQQ+SQQQ 등, 상쇄 쌍) 안 보인다. 여기는
  # 계좌 전체(실제 자본) 기준으로 별도 감시한다 — quant/control/exposure.py
  # (순수 계산) + quant/trade/loop.py(주기 체크) + quant/apps/assembly.py(배선).
  cross_strategy_leverage_alert_pct: 100 # 합산 레버리지가중 노출이 실제 총자본의 이 비율을 넘으면 경고 대상
  # 경고(텔레그램) 재발송 쿨다운은 engine.exposure_alert_cooldown_minutes(위 참고).
  #
  # --- 인트라데이 하드레일(2026-09-03, 소유자 지시 6번) ---
  # "장중 매매는 최대 손실 −5%, 최대 목표 +10%를 유지한다." 감사 결과 이
  # 불변식을 실제로 지키는 전략이 없었다 — structure.py 하드캡(3%)은 구조 모드
  # 손절에만(scalp_1m만 그 경로), pullback_impulse는 손절 캡 자체가 없었다.
  # 두 곳에서 걸린다: risk/manager.py `RiskManagerImpl.approve()`(신규 진입 시
  # stop/target 클램프) + loop.py `_intraday_hard_stop_check`(사이클마다 실제
  # 시세로 재확인 — 전략의 on_cycle이 죽어도 지킨다).
  intraday_hard_stop_pct: 5.0
  intraday_max_target_pct: 10.0
  # 기본 false — 소유자 원문("+10%가 최대 목표")은 "상한선"과 "도달하면 무조건
  # 팔아라" 둘 다로 읽힌다. 강제 매도를 기본으로 켜지 않는다(더 보수적인 해석).
  # true로 켜면 loop.py의 사이클별 백스톱이 +10% 도달 시에도 시장가 청산한다.
  intraday_take_profit_cap_enabled: false
  # 오버나이트(캐리 설계) 전략은 위 레일에서 제외한다. **quant/trade/loop.py의
  # `_OVERNIGHT_STRATEGIES`를 그대로 옮긴 수동 미러다** — risk/manager.py가
  # loop.py를 임포트할 수 없어(loop.py가 이미 manager.py를 가져온다, 순환)
  # 자동 동기화가 불가능하다. loop.py의 그 집합을 바꾸면 이 목록도 같이
  # 바꿀 것 — tests/test_risk_intraday_hardrail.py가 drift를 잡는다.
  overnight_strategies:
    - cross_momentum
    - frgn_accumulate
    - mean_reversion
    - close_bet
    - overnight_drift
    - rsi2_dip
  # 전일/당일 상한가 진입 금지(2026-09-03, 소유자 결정 — "상한가 종목 진입 금지
  # 필터 단타 전략에 바로 적용해줘"). 근거: KR 일봉 2016~2026 3,263종목 실측에서
  # 상한가(+29.5%) 다음날 매수가 −227bp(1일 보유)~−358bp(대형주 유니버스)로
  # 전체 스크린에서 가장 강하고 일관된 음의 엣지였다. **전 전략·모든 진입 경로**
  # (텔레그램으로 손으로 추가한 종목 포함)에 적용되는 회로차단기다 — 전략별로
  # 심지 않는다(risk/manager.py `_prev_limit_up_blocked`). 청산은 절대 막지
  # 않는다(이 파일 상단 원칙과 동일). markets에 없는 시장은 완전히 통과(현재
  # KR만 — 미국은 상하한가 제도 자체가 다르다). 이 게이트는 자동등록 단계에서도
  # 한 번 더 걸린다(watch_scorer._check_prerequisites, L2 — 사유 "전일 상한가").
  prev_limit_up_block:
    enabled: true
    threshold_pct: 29.5
    markets: [KR]
    lookback_sessions: 1 # 지금은 "직전 1세션"만 판정 — 조회할 일봉 개수(n=lookback+2)만 조절
  # 단일 종목 레버리지 ETF 최소 자산(2026-09-05, 소유자 결정 — Toss 제약,
  # scratchpad/letf_spec.md). 지수/섹터 LETF(TQQQ/SQQQ/SOXL/SOXS/UPRO/SPXU/
  # TNA/TZA 등)는 이 목록에 없으므로 무제한이다. Toss stock_info에 레버리지
  # 여부 필드가 없어 목록 + 문턱으로 대신 판정한다(risk/manager.py
  # `single_stock_leveraged_symbols`). ENTER_LONG/SCALE_IN만 차단, 청산은
  # 절대 막지 않는다.
  single_stock_leveraged:
    min_equity_krw: 30000000
    symbols:
      [
        TSLL, TSLQ, NVDL, NVDD, NVDX, AAPU, AAPD, AMZU, AMZD, MSFU, MSFD,
        GGLL, GGLS, METU, METD, CONL, CONI, TSLZ, TSLT, NVD, TSLS, AMDL,
        AMDS, MSTU, MSTZ, COIG, PLTU, PLTD, SMCX, SMCZ, MUU, MUD, AVL, AVS,
      ]

execution:
  broker: toss # toss | kiwoom
  # paper 체결 수수료 가정 (편도, bp). 숫자 하나면 전 시장 공통(하위호환),
  # dict면 시장별로 적용된다. (2026-08-19 소유자가 토스증권 실제 요율표를 줘서
  # 아래 항목들을 대조·정정했다 — 이전 값은 실제보다 낙관적이었다.)
  #   US 10bp — 토스 미국주식 매수 0.1% 그대로. **매도엔 이거 말고도
  #     us_sec_fee_bps(SEC Fee)가 추가로 붙는다** — 아래 참고.
  #   KR 1.5bp — **ETF 기준**(증권거래세 면제). KR 개별주는 여기에 더해
  #     **매도 시 거래세 20bp**가 붙는다(kr_stock_sell_tax_bps, 아래 참고).
  #     개별주를 유니버스에 넣는다면 이 값으로 백테스트하지 말 것 — 왕복 비용을
  #     10배 가까이 과소평가하게 된다.
  #   NXT/KRX 구분(0.014% vs 0.015%, 0.1bp 차이)은 하지 않는다 — paper 브로커에
  #     체결 venue 개념 자체가 없어 구분하려면 주문마다 venue를 새로 모델링해야
  #     하는데, 0.1bp 오차 대비 그 복잡도가 안 맞는다. 더 높은 쪽(KRX 1.5bp)을
  #     쓰는 지금이 이미 보수적(과대 비용) 방향이라 낙관 편향 위험도 없다.
  fee_bps:
    US: 10
    KR: 1.5
  # KR 개별주 **매도**에만 추가되는 거래세(bp) — ETF는 면제(assembly가 securityType으로
  # 분류, 미확인은 개별주 취급). 2026-08-10 사용자 결정: 개별주도 자동/수동 편입하되
  # paper 성적이 세금 포함 실비용을 반영해야 번인 데이터가 낙관 왜곡되지 않는다.
  # **2026-08-19 정정**: 15bp는 틀렸다 — "코스피 0.15%+농특세, 코스닥 0.20%"라고
  # 적었던 게 착오였다. 실제로는 **코스피·코스닥 공통 0.2%**(증권거래세 0.05% +
  # 농어촌특별세 0.15% = 20bp)다. "농특세"를 코스피 몫으로, "0.2%"를 코스닥만의
  # 몫으로 잘못 나눠 읽어 15bp로 과소 계상해왔다 — KR 개별주 매도마다 5bp씩
  # 비용을 낙관해온 셈이다.
  kr_stock_sell_tax_bps: 20
  # 토스증권 미국주식 매도 SEC Fee(2026-08-19 소유자 제공 실제 요율) — 매도금액의
  # 0.00206%(=0.206bp), **최소 $0.01**(us_sec_fee_min_usd). 소액 주문은 요율이
  # 아니라 이 최소액이 지배한다. 매수에는 붙지 않는다(paper.py `_us_sec_fee`).
  us_sec_fee_bps: 0.206
  us_sec_fee_min_usd: 0.01
  # FINRA TAF(2026-08-21) — 미국 매도 전용, 금액이 아니라 **주수** 기준: 주당
  # $0.000166, 주문당 상한 $8.30. SEC Fee 와 별개로 둘 다 부과된다. 백로그
  # P1 잔여 항목(백테스트가 이 비용을 몰라 US 매도 비용을 낙관해왔다).
  us_taf_per_share: 0.000166
  us_taf_cap_usd: 8.30
  # 토스증권 미국주식 **주문당 체결금액 $10 이하는 커미션(fee_bps) 무료** —
  # 매수·매도 공통(paper.py `_commission`). SEC Fee는 이 면제와 무관하게 매도에
  # 항상 붙는다 — 소유자가 준 자료는 "수수료 무료 적용"이라고만 하고 SEC Fee까지
  # 면제되는지는 밝히지 않아, 비용을 낙관하지 않는 쪽(SEC Fee는 부과)으로 뒀다.
  us_free_commission_notional_usd: 10
  # paper 체결가에 불리한 방향으로 적용하는 슬리피지(편도, bp). 추정치다: TQQQ는
  # 09:35 스프레드가 대략 1~3bp, SQQQ는 저가·저유동성이라 3~10bp로 본다 — 실측
  # 데이터로 검증된 값이 아니다. 0이 "모름"이 아니라 "틀림"이라는 판단 하에 두 종목의
  # 중간값을 기본으로 둔다.
  slippage_bps: 2.5
  # 통화별 현금 지갑 분리(2026-09-01 소유자 지시: "원화는 원화로, 달러는
  # 달러로만. 환전 금지"). true면 paper 브로커가 KRW/USD 현금을 별도 풀로
  # 관리한다(quant/adapters/execution/paper.py `dual_currency`) — KR 체결은
  # KRW 풀만, US 체결은 USD 풀만 움직인다. 이 키가 없거나 false면 기존 단일
  # KRW 풀 동작(US 체결도 환산해 같은 풀 사용) 그대로다.
  dual_currency_cash: true

# 키움 실시간 웹소켓(체결가) 시세 라우트. 실키가 아직 등록 전이라 실서버 검증이
# 안 됐다 — kiwoom-probe로 실서버 확인 전까지 기본 비활성. 켜져 있어도 연결 실패나
# stale 시세는 안전하게 toss REST 폴백으로 처리된다(quant/adapters/brokers/kiwoom/
# datafeed.py, app/assembly.py의 build_kiwoom_realtime_route 참고).
kiwoom:
  realtime:
    # 2026-08-10 09:05 장중 검증 통과 — 실전 서버(api.kiwoom.com)에서 005930 실시간
    # 틱 수신 확인(233,500원). 모의 서버도 동작하나 실전 시세를 쓴다.
    # 웹소켓이 죽거나 stale_seconds를 넘기면 MarketDataService가 Toss REST로 자동
    # 폴백하므로, 켜는 것 자체가 단일 실패점을 만들지는 않는다.
    enabled: true
    stale_seconds: 30 # 최신 틱이 이보다 오래되면 웹소켓이 죽은 걸로 보고 toss로 폴백
    startup_timeout_seconds: 10 # 기동 시 이 시간 안에 연결이 안정되지 않으면 라우트 없이 진행
    # 세력 신호 수집(0w 프로그램매매·0F 거래원·FID 27/28 최우선호가 →
    # data/ledger/smart_flow.jsonl 원문 적재). 2026-08-29 KR 개장부터 켠다 —
    # 소유자 지시 "세력 들어가는 곳 빨리 탐지"의 1단계(하루 실프레임으로 FID
    # 형식 확정 → 선행 신호 실측 → 전략화). 수집 전용이라 매매 판단에 미개입.
    smart_flow_enabled: true

notifications:
  telegram:
    enabled: true
    heartbeat_minutes: 30

# 신규 진입 승인 게이트 — 텔레그램 버튼으로 사람이 수락해야 진입한다.
# 청산(EXIT_LONG/SCALE_OUT)과 kill-switch flatten은 **절대** 이 게이트를 거치지 않는다.
# 2026-08-08 사용자 결정으로 기본 비활성: 완전 자동 시그널 매매로 운영한다.
# 코드는 남긴다 — 새 전략/새 시장을 실계좌에 처음 붙일 때 리허설 장치로 다시 켤 수 있다.
approval:
  enabled: false
  # 어떤 MODE에서 승인을 요구할 것인가. live만 넣는 이유: paper는 실제 돈이 걸리지
  # 않는데 승인을 요구하면 사람이 자는 동안 신호가 전부 만료돼 paper 성과가 실전략과
  # 달라진다(=paper가 검증 수단으로서 무의미해진다). [paper, live]로 두면 승인 흐름
  # 자체를 실계좌 전에 리허설할 수 있다.
  required_modes: [live]
  # 승인 유효시간(초). 15분봉 전략의 봉 하나(900초)보다 확실히 짧게 잡는다 — 다음 봉이
  # 완성될 때까지 유효하면 이미 조건이 달라진 신호를 승인하게 된다. 300초면 휴대폰
  # 알림을 보고 판단할 시간은 되면서 신호의 유효성은 유지된다.
  expire_seconds: 300
  # 승인 시점 재검증: 요청 당시 가격 대비 이만큼 넘게 움직였으면 실행하지 않는다.
  # TQQQ 15분봉의 통상 변동폭 안쪽 값이다 — 이보다 크게 움직였다면 사용자가 보고
  # 판단한 그 거래가 아니다.
  max_price_drift_pct: 0.5
  # 종결된 요청 레코드 보관 기간(초). 1일 — 당일 감사(무엇을 승인/거절했나)에는
  # 충분하고 상태 파일이 무한히 커지지 않는다.
  prune_after_seconds: 86400

# 코드 미소비 — Config.banker 프로퍼티는 2026-08-30 사망 코드 정리로 삭제됐다.
# 이 블록을 읽는 파이썬 코드가 없다(사망 코드 전수조사 확인).
banker:
  enabled: true
  daily_report_hour_kst: 7 # 매일 아침 실계좌 진단 리포트

# 하루 1회(세션 시작 전) 계산하는 시장 국면 판단 → risk_multiplier 하나
# (quant/trade/regime/). 거래 사이클 핫패스에서는 절대 다시 계산하지 않는다 —
# RegimeProvider.risk_multiplier()는 캐시(data/state/regime.json)만 읽는다.
# 통합(risk/manager.py에서 실제로 곱하는 배선)은 이 설정 자체와 별개 작업이다.
# 판단 근거·한계는 docs/adr/0009-daily-regime-assessment.md 참고.
regime:
  risk_multipliers:
    defensive: 0.5 # 방어는 그대로 — "질 때는 잘 버틴다"의 축
    neutral: 1.0
    aggressive: 1.5 # 2026-08-10 공격적 베이스라인: 1.3 → 1.5 (사용자 지시)
  aggressive_min_score: 2 # 지표 점수 합(+1/0/-1)이 이 값 이상이면 aggressive
  defensive_max_score: -2 # 이 값 이하면 defensive
  # 2026-08-19 추가: 유효 지표(조회 성공) 개수가 이 값 미만이면 점수 합산을 하지
  # 않고 강제로 neutral(1.0x)+degraded=True 로 떨어뜨린다. 근거(2026-08-18 실측):
  # US 국면이 그날 하루 종일 aggressive(1.5x)였는데, 5개 지표(qqq_trend/
  # qqq_volatility/kr_bond_yield/kospi/bitcoin) 중 3개(국채·코스피·비트코인)가
  # 조회 실패로 제외되고 남은 2개(qqq_trend/qqq_volatility)만으로 점수 합이
  # aggressive_min_score(2)에 도달했다 — "모른다"를 무시하고 소수 지표만으로
  # 공격 신호를 낸 것과 같은 모양이다(quant-expert SKILL.md §5). 다만 기본값 2는
  # 이 정확한 사례(2개 유효 지표 자체가 2 이상)를 막지 못한다는 한계가 있다 —
  # 재발을 실제로 막으려면 지표 풀 대비 과반(US 5개 중 3개 이상 등)을 요구하는
  # 게 필요하다. KR(지표 2개: KR 추세/KR 수급)에는 이미 구조적으로 존재하던
  # 안전장치를 명시화한 것뿐이다 — KR은 aggressive/defensive에 도달하려면
  # 애초에 지표 2개가 전부 성공하고 방향까지 일치해야 하므로, 이 게이트가
  # 실제로 값을 바꾸는 경우는 "지표 1개만 성공"(이전엔 degraded=False로 조용히
  # neutral 처리) 케이스뿐이다.
  min_valid_indicators: 2
  # 2026-08-19 추가(위 min_valid_indicators 한계를 실제로 메우는 게이트) — aggressive
  # 승격에만 적용되는 두 요건. 방어(defensive)는 부분 정보로도 그대로 발동한다 —
  # 리스크 축소는 정보가 불완전해도 안전측이라 게이트를 안 건다("모르면 작게,
  # 절대 크게 가지 않는다"는 비대칭이 이 블록의 핵심 설계 결정이다). 점수 합이
  # aggressive 임계를 넘어도 아래 둘 중 하나라도 미달이면 neutral로 강등하고
  # degraded=True로 남긴다(quant/trade/regime/provider.py RegimeProvider._finalize).
  # 2026-08-19 수정: 절대값(aggressive_min_valid: 3)은 US 5개 지표 풀 기준으로
  # 잡은 값인데, KR은 지표가 구조적으로 kr_trend/kr_flow 2개뿐이라 3을 영원히
  # 못 채운다 — 의도한 안전장치가 아니라 "KR은 절대 aggressive에 못 간다"는
  # 부작용이었다(2026-08-18 US 사고 재발 방지 게이트를 달다가 KR을 영구 봉쇄).
  # 절대값 대신 **로스터 상대 비율**로 바꿨다: 각 시장의 계산 함수가 실제로 만든
  # IndicatorResult 총 개수(성공+실패, quant/trade/regime/provider.py의
  # RegimeProvider._finalize가 len(results)로 구한다 — 하드코딩 아님, 지표
  # 추가/제거에 자동으로 따라감)에 이 비율을 곱해 올림(ceil)한 값이 하한이다.
  # US(로스터 5): ceil(5*0.6)=3 — 08-18 재현 케이스(유효 2개, 전부 QQQ 파생)는
  # 여전히 차단된다. KR(로스터 2): ceil(2*0.6)=2 — kr_trend/kr_flow 둘 다 유효
  # 하고 방향이 일치하면 기본 설정으로 aggressive가 정상 발동한다(구조적 봉쇄 해소).
  aggressive_min_valid_ratio: 0.6
  # 하위호환: 여기에 옛 절대값 aggressive_min_valid: <숫자> 를 추가하면 비율
  # 대신 그 값을 그대로 하한으로 쓴다(RegimeProvider.__init__ 참고) — 운영자가
  # 특정 시장만 더 조이고 싶을 때(예: KR도 US처럼 3개를 요구)의 탈출구다.
  aggressive_min_sources: 2 # 서로 다른 원천(source) 최소 개수 — 같은 자산(QQQ)에서
  # 파생된 지표 2개(qqq_trend/qqq_volatility)는 원천 1개로 센다(provider.py의
  # INDICATOR_SOURCE 매핑). 상관된 신호 2개가 독립 표 2개인 것처럼 카운트되면
  # 1.5배 레버리지를 정당화 못 하는 근거로 정당화하게 된다. kr_trend(KR_TREND)/
  # kr_flow(KR_FLOW)는 이미 서로 다른 원천이라 KR에서는 이 요건이 항상 충족된다.

ai_trader:
  # 신입사원 AI 트레이더(수습) — 2단계 태그 소스 승격 스위치 (2026-08-26).
  # false(기본): 판단만 원장에 기록(수습). true: 그날 픽을 무태그 후보로
  # watch-score 확신도 게이트에 올리고, 통과분만 워치리스트에 자동 편입
  # (own_brief 와 같은 이중 게이트 — 유니버스 합류일 뿐, 진입은 전략이 가격으로).
  # **켜는 조건은 사람이 판단한다**: 16:20 장마감 리포트 리더보드에서
  # ai_trader 생산자가 promote 판정(다중검정 보정 통과)을 받은 뒤.
  tag_source_enabled: false

# 알림 전용 워치 조건 — 트레이딩뷰 알림의 우리판(2026-08-30). 주문·시그널을
# 만들지 않는다(quant/trade/watch_conditions.py 참고) — 조건이 발동하면
# 텔레그램 알림만 보낸다. 유니버스 밖 심볼도 지정 가능하다(전략 배정과 무관).
watch_conditions:
  enabled: true
  cooldown_minutes: 60 # 같은 조건 재알림 최소 간격
  rules:
    - name: "QQQ 과매도(RSI2)"
      symbol: "QQQ"
      metric: rsi2 # rsi2 | rsi14 | change_pct(당일 등락%) | price
      op: "<"
      threshold: 10
    - name: "KODEX200 과매도(RSI2)"
      symbol: "069500"
      metric: rsi2
      op: "<"
      threshold: 10
    - name: "TQQQ 급락 관찰"
      symbol: "TQQQ"
      metric: change_pct
      op: "<"
      threshold: -3.0

governor:
  # 사망 판정(quant.control.experiments.consecutive_dead_candidates)이 K거래일
  # 연속 이어져도 자동 비활성(quant.control.governor.ALLOWED_KILL_SWITCH) 대상
  # 에서 제외되는 전략 (작업2, 2026-09-02). 소유자 지시(2026-08-30): "scalp_1m
  # 은 핵심 무기 — 버리지 말고 파라미터·타이밍 조정으로 개선". 보호된 전략은
  # 대신 "사망 경보 지속 중 — 개선 실험 필요" 알림만 받는다(governor-apply,
  # 장외 시간 notify_auto) — 포지션 관리는 전략이 켜져 있는 한 그대로 계속된다.
  protected_strategies: [scalp_1m]
