    # 관심종목에 동일하게 적용되므로 시장별로 다르게 둘 근거가 없다.
    # 2026-08-17: KR 0.15 → 0.075 — 갈래 A/B(spec §5)에 KR 50%를 내주려 갈래 C
    # 기존 비중을 균등 x0.5(파일 상단 "3갈래 자본 배분" 표 참고). US는 불변.
    capital_fraction:
