      entry_rsi: 10
      zscore_window: 20
      rsi_period: 2
      atr_period: 14
      atr_stop_mult: 2.0
      exit_z: -0.5
      max_hold_sessions: 5
      turnover_window: 20
      min_turnover: 1000000000 # 20일 평균 거래대금 10억원 미만 종목은 진입하지 않음

  cross_momentum:
    class: cross_momentum
