    # (RSI14/MACD 12·26·9/볼린저 20·2σ/SMA 20·50) 그대로 — 여러 조합을 시도해
    # 고른 값이 아니다. 백테스트 미검증 [미검증], paper 번인 시작.
    # 2026-08-25 소유자 지시(전략 4종 체제): 한국장 중심 재편 — ①뉴스·미국섹터
    # 개장 단타(news_momentum) ②1분봉 스캘핑(scalp_1m) ③종가배팅(close_bet, 신규)
    # ④외국인 추세(frgn_accumulate). 이 4종과 겹치지 않는 전략은 오늘 미국장부터
