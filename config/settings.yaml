      entry_start_minutes_after_open: 0
      no_entry_minutes_before_close: 60
      sma_fast: 20
      sma_slow: 50
      rsi_period: 14
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      cross_lookback: 3
      bb_period: 20
      bb_num_std: 2.0
      squeeze_lookback: 20
      box_lookback: 20
      box_tolerance_pct: 1.5
      volume_mult: 1.5
      min_confluence: 3
      atr_period: 14
      atr_stop_mult: 1.0 # 분봉 기준 ATR — 일봉 기준(orb_scan/intraday_scan 0.35)과 인터벌이 달라 값도 다르다
      scale_out_at_r: 1.5
      scale_out_fraction: 0.3
      risk_budget_pct: 1.0
      max_leverage: 1.0
