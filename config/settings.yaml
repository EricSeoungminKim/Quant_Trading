# 전략 파라미터 & 엔진 설정. git 추적, 핫 리로드 대상.
# 시크릿은 절대 여기 넣지 않는다 → .env.local

engine:
  # 5초: Toss rate limit(MARKET_DATA 10 TPS) 기준 2종목 0.4 TPS로 여유가 크다.
  # 더 줄이려면 폴링이 아니라 키움 웹소켓 이벤트 기반으로 가는 게 맞다(폴링 주기를
  # 좁히는 것은 비용만 늘고 체결 지연의 본질은 그대로다).
  poll_seconds: 5
  timezone: Asia/Seoul
  # 장중 하트비트 알림 주기(분) — "엔진이 살아 있는가". 30분: 생존 확인은 드물어도
  # 충분하고(진짜 장애는 워치독이 5분 안에 잡는다), 5분이면 실제로 봐야 할
  # 체결·포지션 알림이 하트비트에 묻힌다 (2026-08-11 사용자 요청).
  heartbeat_minutes: 30
  # 포지션 현황(진입가 대비 손익·R·손절·보유시간) 주기(분) — 보유 중일 때만 발송.
  # 하트비트와 분리한 이유: 진입 직후가 가장 궁금한 구간이라 주기가 달라야 한다.
  position_report_minutes: 5
  max_consecutive_cycle_failures: 3 # 연속 사이클 실패 허용 횟수 — 넘으면 신규진입 자동 중단(halt)
  cycle_failure_alert_cooldown_minutes: 10 # 사이클 실패 알림 재전송 최소 간격(분) — 스팸 방지
  # 전략 간 합산 노출 경고(risk.cross_strategy_leverage_alert_pct) 재전송 최소
  # 간격(분, 2026-08-30) — 계산 자체(로그)는 position_report_minutes 주기로
  # 계속 돌고, 이 쿨다운은 텔레그램 알림에만 적용된다.
  exposure_alert_cooldown_minutes: 60
  max_consecutive_stale_data: 3 # 연속 데이터 조회 실패(전 소스 degraded) 허용 횟수 — 넘으면 경고 알림
  # 보유 종목의 현재가를 이 시간(초) 이상 못 받으면 알림. 전략의 손절 판정은
  # `quote is None`이면 조용히 건너뛰므로, 시세가 끊긴 동안은 손절이 아예 작동하지
  # 않는다 — 무인 운용에서 이 침묵이 가장 위험하다 (2026-08-11).
  unpriced_position_alert_seconds: 60
  # 사이클 총 소요시간(ms)이 이 값을 넘으면 WARNING 로그(단계별 내역 포함). poll_seconds(10초)의
  # 10%를 임계로 잡음 — 이보다 느려지면 폴링 주기를 갉아먹기 시작해 그대로 슬리피지로 이어진다.
  slow_cycle_warn_ms: 1000
  # 사이클 내 시세 캐시 TTL(초). 한 사이클에서 quote()는 최소 3번 불린다(전략·리스크·
  # 체결). 캐시가 없으면 셋이 서로 다른 HTTP 응답을 보게 되어 주문금액 검증이 무의미해지고,
  # 매 사이클 심볼당 3~4회 API를 때린다.
  #
  # 2→5 (2026-08-28): 스캘핑 전략을 병렬로 여러 개 돌리면서 사이클 자체가 3.8~5초로
  # 길어졌다. TTL 2초는 **한 사이클 안에서** 만료되어, 사이클 후반에 도는 전략과
  # 리스크·체결이 전반부 전략과 다른 시세를 본다 — 캐시가 막으려던 바로 그 상황이
  # 사이클 내부에서 재발한다. TTL을 사이클 길이에 맞추면 (a) 한 사이클의 모든
  # 전략이 같은 순간의 스냅샷으로 판단하고 (b) 호출 수가 전략 수와 무관해진다.
  #
  # poll_seconds와 같은 값이어도 다음 사이클은 확실히 새 시세를 받는다: 루프는
  # 사이클 **작업이 끝난 뒤** poll_seconds만큼 sleep하므로(loop.py) 실제 사이클
  # 주기는 작업시간 + 5초 > 5초다. poll_seconds를 이 값보다 줄이면 시세가 사이클을
  # 건너 재사용되므로 반드시 함께 조정할 것.
  quote_cache_seconds: 5
  # 봉(bars) 공유 캐시. 키는 TTL이 아니라 **현재 시각이 속한 봉 경계**라, 1분봉이면
  # 같은 분 안의 모든 요청이 소스를 정확히 한 번만 때리고 분이 바뀌면 즉시 새로 받는다.
  # 전략 8개 × 20종목 = 사이클당 160회 → 20회. 끄면 캐시 도입 전과 동일하게 동작한다.
  bar_cache_enabled: true
  # 사이클당 콜드 페치(봉 캐시 미스로 실제 소스를 때리는 횟수) 예산. 유니버스
  # 롤 직후(08:27/22:10 등)나 세션 경계에 신규 심볼 수십 개의 캐시 미스가 한
  # 사이클에 몰리면 그 사이클이 18~23초까지 늘어난다(평상시 24~45ms). 예산을
  # 넘는 캐시 미스는 소스를 때리지 않고 DataSourceError로 즉시 거부해 다음
  # 사이클(들)로 나눠 처리한다 — 30심볼 콜드 페치면 8×4사이클(~40초)로 퍼진다.
  # 이미 캐시된 심볼(히트)은 예산과 무관 — 신규 심볼 평가만 늦어진다. 보유
  # 포지션의 손절 판정은 quote() 기반이라 이 예산의 영향을 받지 않는다(단,
  # 같은 전략이 신규 콜드 심볼도 함께 요청 중이면 그 전략의 on_cycle 자체가
  # DataSourceError로 이번 사이클만 통째로 스킵될 수 있다 — 소스 장애 시의
  # 기존 동작과 동일하고, 다음 사이클에 예산이 리셋되며 자연 회복된다).
  cold_fetch_budget_per_cycle: 8
  # 브로커 대사(reconciliation) 주기(분). 기동 시 1회는 항상 하고, 이후 이 주기로
  # 엔진 소유 원장 vs 브로커 실보유를 대조한다. 불일치 시 신규 진입만 halt하고
  # 청산은 계속 동작한다. 엔진 소유 원장을 노출하는 브로커에서만 활성.
  reconcile_interval_minutes: 5
  # 미체결 주문 나이 감시(초, 2026-08-30 실계좌 방어선) — 위 대사 주기마다 브로커
  # open_orders() 중 이 값 이상 된 주문을 자동 취소 시도한다. 시장가 위주 운용이라
  # 평시엔 거의 항상 빈 목록이지만, 브로커가 주문을 물고 있는 장애 시나리오의 방어선.
  stale_order_seconds: 120
  # 틱 로거(2026-08-28 소유자 지시) — Toss 1분봉이 4거래일 롤링이라 소급이 안 되므로
  # 엔진이 사이클마다 읽는 시세를 초 단위로 data/ticks/{market}/{YYYY-MM-DD}.jsonl에
  # 남긴다. 파동 스캘핑 전략의 재료. 거래 핫패스에는 메모리 버퍼 append만 하고,
  # 디스크 쓰기는 flush_seconds마다 한 번(append-only)만 한다.
  tick_log:
    enabled: true
    flush_seconds: 30

universe:
  us: [TQQQ, SQQQ]
  kr: [] # KR ETF 예: ["122630", "252670"] (KODEX 레버리지/인버스2X) — 데이터 검증 전 비활성
  ranking:
    enabled: false
    market: US
    type: MARKET_TRADING_AMOUNT
    count: 20
  # 관심종목 유니버스. 파일은 data/watchlist.yaml (git 미추적 런타임 상태) —
  # 텔레그램 /watch로 편집되고 엔진은 세션 시작(KST 거래일 롤)에 읽기만 한다.
  # 켜도 심볼을 실제로 받는 것은 전략 설정에 `universe: watchlist`가 있는 전략뿐이다:
  # 지금 전략들은 전부 고정 심볼 쌍(TQQQ/SQQQ) 기반이라 임의 종목을 부으면 깨진다.
  watchlist:
    enabled: true # 2026-08-09 사용자 결정 — 텔레그램 /watch가 그날의 스캔 대상을 정한다
    auto_score:
      enabled: true
      # watch-score v2 통과 기준(국면에 따라 defensive +10 / aggressive -5 조정, US 심볼 +5).
      # 채택된 값이 아니라 기록: 프리퍼시티(하드 게이트) 통과 후 증거 점수(0~100) 기준.
      threshold: 50
      # 2026-08-10 사용자 결정: KR 개별주도 자동 편입 허용 — 대신 paper 수수료 모델이
      # 매도세 15bp(execution.kr_stock_sell_tax_bps)를 반영해 성적이 실비용 기준.
      allow_kr_stocks: true

# --- 전략 검증 게이트 (2026-08-11 사용자 지시: "검증 규율을 따르게끔 구축") ---
# 모든 전략은 validation.status를 선언해야 한다(2026-09-03: 3단계로 확장):
#   burn_in       — 미검증. capital_fraction이 아래 상한(0.2)으로 강제 캡핑된다.
#                   (기본값 — validation 블록 자체가 없어도 이 취급.)
#   backtest_pass — `quant.apps.cli promote`(quant/control/promotion.py)가 붙이는
#                   중간 상태: 백테스트 게이트(backtest-gate CLI)가 GO 판정을
#                   냈지만 아직 paper 라운드트립 검증 전. capital_fraction 캡은
#                   burn_in과 동일(0.2) — 기동 로그에만 evidence 요약이 별도로
#                   찍힌다(assembly.validated_capital_fractions).
#   verified      — 위 backtest_pass에서 paper 30 라운드트립 + 승률 신뢰구간이
#                   50%를 위로 벗어난 뒤 사람이 승격. evidence(근거 문자열/dict)
#                   필수 — 없으면 조립이 burn_in으로 강등하고 경고한다(거짓 선언을
#                   막는 최소 장치).
# 경로: burn_in → (backtest-gate GO + promote) → backtest_pass →
#       (paper 30 라운드트립 + 승률 유의, ledger.py 판정 기준과 동일) → verified.
# backtest_pass→verified 승격은 여전히 사람이 evidence를 채워서 한다 — 코드가
# 자동 승격하지 않는다(숫자 조작 유인 차단).
validation_gate:
  burn_in_max_capital_fraction: 0.2

# --- 시장별(KR/US) capital_fraction 분리 (2026-08-12 사용자 지시) ---
# donchian은 TQQQ/SQQQ 고정이라 US 정규장 전용이다. capital_fraction이 전역
# 스칼라이던 시절엔 donchian이 0.4를 점유한 채 KR 세션 내내 놀아서, KR 세션에는
# 자본의 60%만 배치되는 구조적 낭비가 있었다(감사로 실측 확인). 아래 시장별
# 배분표가 그것을 고친다.
#
# **이 배분은 성과 기반이 아니다.** 이 시점 실측 스코어보드는 종결 9건뿐이고
# intraday_scan은 기대값 −65.4bp·payoff 0.43·승률 95% CI [22%, 78%]로 판단 불가
# 구간이다 — 스코어보드가 "표본 부족, 이 숫자로 자본 배분을 결정하지 마라"고
# 직접 경고한다. 그래서 아래 표는 **구조적 사실**(어느 전략이 그 시장에서 거래
# 가능한가)만 반영하고, 나머지는 균등에 가깝게 둔다. 종결 30건 + 승률 유의
# 이후에는 성과로 재배분한다.
#
# --- 3갈래 자본 배분 (2026-08-17 사용자 결정, spec §5) ---
# docs/superpowers/specs/2026-08-17-quant-automation-design.md 의 확정 사항:
# 갈래 A(단타 자동, news_scalp) 20% / 갈래 B(외국인 적립, frgn_accumulate) 30%
# / 갈래 C(기존 전략 전체) 50% — 새 최상위 개념을 만들지 않고 기존
# per-strategy capital_fraction 메커니즘으로 그대로 표현한다. A/B는 KR
# 전용(데이터 소스 자체가 한국 종목만 다룬다)이라 US 예산은 건드리지 않는다
# — 그래서 아래 표는 **KR만** C의 기존 비중을 절반(x0.5)으로 눌러 A+B에
# 내준다(각 전략의 KR 내 상대 비중은 그대로 유지 — 성과 판단이 아니라 균등
# 축소). US는 A/B가 배분이 0이므로 기존 값 그대로다. A/B는 태그 배선 완료
# (2026-08-17, 서브프로젝트 T Task 1~3) 후 `enabled: true`로 paper 가동 중 —
# tags_of에 태그가 없으면(리포트 미발행 등) 여전히 조용히 아무 것도 하지 않는다.
# 추후 원칙: 종결 표본이 쌓이면(§4 승격 게이트, ledger.py 판정 함수 +
# `run scoreboard` 출력) 수익률 기반으로 재배분한다 — 잘 버는 갈래에 지분을
# 늘리고 자주 잃는 갈래에서 줄인다. 그때까지는 이 표가 근거다.
#
#                  KR       US    비고
#   donchian       0.0      0.3   TQQQ/SQQQ 고정 — KR에선 거래 불가(구조적 0)
#   orb_scan       0.1      0.2   (갈래C, KR 기존 0.2 → x0.5)
#   intraday_scan  0.1      0.1   (갈래C, KR 기존 0.2 → x0.5) US 0.2→0.1: scalp_1m US에 0.1 이관
#   news_momentum  0.1      0.0   (갈래C, KR 기존 0.2 → x0.5) EVENT 태그가 한국
#                                 회사 리포트에서만 나온다 — US는 데이터 소스 자체가 없음
#   confluence     0.075    0.2   (갈래C, KR 기존 0.15 → x0.5)
#   mean_reversion 0.075    0.0   (갈래C, KR 기존 0.15 → x0.5)
#   cross_momentum 0.05     0.1   (갈래C, KR 기존 0.1 → x0.5)
#   news_scalp(A)  0.1      0.0   2026-08-18: 0.2→0.1, scalp_1m KR에 0.1 이관(같은 유니버스,
#                                 개장 진입 vs 1분봉 조기진입 A/B 병행 비교)
#   frgn_accumulate(B) 0.3  0.0   외국인 수급 태그(KR 전용)
#   scalp_1m       0.1      0.1   신규(2026-08-18 스펙) — news_scalp(KR)/intraday_scan(US)에서
#                                 각 0.1씩 이관. 같은 유니버스·같은 날 성적을 나란히 채점해
#                                 n>=30에서 수수료 후 bp로 승부(스펙 §배분)
#                  합 1.00  합 1.00

strategies:
  donchian:
    class: donchian
    # 2026-08-25 소유자 지시(전략 4종 체제): 한국장 중심 재편 — ①뉴스·미국섹터
    # 개장 단타(news_momentum) ②1분봉 스캘핑(scalp_1m) ③종가배팅(close_bet, 신규)
    # ④외국인 추세(frgn_accumulate). 이 4종과 겹치지 않는 전략은 오늘 미국장부터
    # **비활성** — 코드·원장은 남긴다(측정 기준점 + 추후 복원).
    enabled: false
    # 2026-08-12 시장별 분리(파일 상단 표 참고): KR은 TQQQ/SQQQ 자체가 거래 불가라
    # 구조적으로 0 — 성과 판단이 아니다. US는 기존 0.4에서 0.3으로(다른 전략에
    # KR 자본을 내주기 위한 재배분, donchian 자체 성과 저하가 아니다).
    capital_fraction:
      KR: 0.0
      US: 0.3
    validation:
      status: verified
      evidence: >-
        전작 stock-algo-trade에서 라이브 검증된 donchian_apex 파라미터 계승 +
        본 저장소 실데이터 백테스트/회계 사다리 통과 (docs/adr/0007)
    symbols: [TQQQ, SQQQ]
    params:
      # stock-algo-trade의 라이브 검증 파라미터(donchian_apex) 계승
      interval_minutes: 15
      lookback_bars: 40
      volume_mult: 1.5
      stop_fallback_pct: 1.5
      # 손절폭 하한(bp). 돌파봉 저가가 종가에 붙으면 r0가 왕복비용(US ~25bp)보다
      # 좁아져 목표가가 비용 안에 갇힌다 — 리스크 감사에서 미설정(0) 발견, 명시.
      stop_min_bps: 30
      # 2026-08-10 공격적 베이스라인(사용자 지시): 2.0 → 2.5. 목표를 멀리 두고
      # 승자를 더 달리게 한다. 백테스트 재검증 전까지 '지시된 베이스라인'으로 취급.
      risk_reward: 2.5
      max_concurrent_names: 1 # TQQQ/SQQQ는 역방향 쌍 — 동시 보유 금지
      flatten_before_close_minutes: 10
      min_session_bars_before_entry: 2
      # true = 손절 후 재진입 허용, 휩소 장에서 연속 손절 위험 / false = 전작 동작(1일 1회 진입 제한)
      allow_same_day_reentry: true
      position_mgmt:
        initial_tranche_frac: 1.0
        # 2026-08-10 리스크 감사: initial_tranche_frac 1.0이면 add_weight=0이라
        # SCALE_IN이 항상 예산 0으로 거부되는 죽은 신호가 0.5R~1.4R 구간에서 5초마다
        # 재발동한다 — 명시적으로 끈다. 승자 피라미딩은 백테스트 검증 후 tranche를
        # 낮추면서(예: 0.7) 다시 켤 것.
        scale_in_at_r: 0
        max_scale_ins: 0
        no_add_minutes_before_close: 60
        # 2026-08-10 공격적 베이스라인: 부분익절을 늦추고(1.0R→1.5R) 덜 덜어낸다
        # (50%→30%). 문헌상 부분익절은 기대값을 깎는 비용이므로(드로다운 관리
        # 목적일 때만 정당) 승자를 더 오래·더 크게 유지하는 쪽으로 이동.
        scale_out_at_r: 1.5
        scale_out_fraction: 0.3
        breakeven_after_scale_out: true

  orb:
    class: orb
    enabled: false # 미검증(unvalidated) — 실 TQQQ/SQQQ walk-forward 백테스트 전까지 비활성. quant/trade/strategy/orb.py 상단 docstring 참고
    capital_fraction: 1.0
    symbols: [TQQQ, SQQQ]
    params:
      # 규격 출처: Zarattini & Aziz (SSRN 4416622) Table 1. 규칙별 근거는
      # quant/trade/strategy/orb.py 상단 docstring 참고.
      long_symbol: TQQQ
      inverse_symbol: SQQQ # OR 봉이 음봉일 때 역방향 익스포저로 매수하는 종목
      signal_symbol: TQQQ # 방향을 판정하는 종목(논문: QQQ 또는 TQQQ)
      bar_interval_minutes: 5
      opening_range_minutes: 5 # 논문 규격. bar_interval_minutes의 배수여야 함
      # ↓ 아래 세 값은 **전구간(2016~2026) 측정으로 고른 in-sample 최적값**이다.
      # 논문 기본값이 아니다. 근거와 한계를 같이 읽을 것:
      #
      # 판정 축은 총수익률이 아니라 **왕복 1회당 명목 대비 총수익(bps)**이다 —
      # 수수료도 손익도 명목가치에 비례하므로 포지션 크기로는 순손익의 부호를
      # 바꿀 수 없다. 왕복 비용은 14bp(키움 7bp x2)다.
      #   손절 폭: 논문 기본 ATR x0.05는 2.4bp뿐(너무 타이트해 한 번에 잡는 폭이
      #            작다). 넓힐수록 커지다 x0.35에서 8.2bp 정점, 그 뒤 하락.
      #   도지 임계: 논문이 "open ~ close"라고만 쓰고 **값을 정의하지 않은 자리**다.
      #            0.02%→8.2bp, 0.25%→13.6bp, 0.50%→23.7bp, 0.80%→27.1bp,
      #            1.25%→ -20bp(표본 고갈). 0.5~0.8%의 고원이고 특정 값에 민감하지 않다.
      #
      # **아직 채택 근거는 아니다.** 이 조합의 in-sample 성과는 +68.4%/Sharpe 0.48인데:
      #   - 조합 15개 이상을 시도한 뒤 나온 값이다(다중검정 미보정)
      #   - walk-forward OOS는 양수지만(총 +59.0%, Sharpe 0.65) 윈도우별 Sharpe의
      #     t는 약 1.9로 유의하지 않고, 파라미터가 윈도우마다 크게 요동한다
      #     (relative_volume_min flip_rate 0.41)
      #   - 같은 기간 TQQQ 단순보유는 +2,980%(CAGR 38%, Sharpe 0.83)로 여전히 크게 진다
      # 그래서 enabled는 false로 둔다. 이 값을 성과로 읽지 말 것.
      doji_threshold_pct: 0.50
      stop_mode: atr_pct # or_extreme(논문 기본: 첫 봉 저가/고가) | atr_pct(개선판: 일봉 ATR 배수)
      atr_period: 14
      atr_stop_mult: 0.35
      atr_interval: 1d # 논문의 ATR은 일봉 14일 기준 — 분봉으로 바꾸면 손절 거리가 자릿수 단위로 달라진다
      profit_target_r: null # 논문 기본 10R / 개선판 null(EoD까지 보유)
      risk_budget_pct: 1.0 # 트레이드당 리스크 예산(계좌 %) — 논문 1%
      max_leverage: 1.0 # 논문 4x. 우리는 증거금·이자를 모델링하지 않아 현금계좌(1.0)가 기본
      relative_volume_min: null # null=필터 없음 / 1.0=논문 [B]의 RV>=100% 게이트
      relative_volume_days: 14
      # 1 = 세션 안에서 실행 가능한 마지막 사이클(15:55)에 청산. 0으로 두면 안 된다:
      # 16:00에는 is_market_open이 False라 minutes_to_close가 None이 되고
      # should_flatten이 무조건 False가 되어 청산 창이 통째로 사라진다(실측 확인).
      flatten_before_close_minutes: 1

  intraday_scan:
    class: intraday_scan
    # 2026-08-10 사용자 지시로 paper 번인 시작 — 세션 신고가 돌파 + 거래량 게이트.
    # orb_scan(개장 5분)이 놓치는 장중 움직임 담당. 백테스트 미검증 [미검증] —
    # 수익성 주장 없음, 번인 성적(스코어보드 bps)이 판단 근거가 된다.
    # 2026-08-25 소유자 지시(전략 4종 체제): 한국장 중심 재편 — ①뉴스·미국섹터
    # 개장 단타(news_momentum) ②1분봉 스캘핑(scalp_1m) ③종가배팅(close_bet, 신규)
    # ④외국인 추세(frgn_accumulate). 이 4종과 겹치지 않는 전략은 오늘 미국장부터
    # **비활성** — 코드·원장은 남긴다(측정 기준점 + 추후 복원).
    enabled: false
    # 2026-08-12(1차): 활성 전략이 6개가 되며 합계가 1.10으로 100%를 넘었다(감사
    # 지적). intraday_scan은 다른 burn_in 전략과 같은 미검증 상태인데 혼자 2배
    # 배분을 갖고 있을 근거가 없어 0.2 → 0.1로 낮췄다. 이후 news_momentum 추가로
    # 합계가 다시 갱신됨 — 최신 합계 내역은 orb_scan 블록의 주석 참고.
    # 2026-08-12(2차) 시장별 분리(파일 상단 표 참고): KR/US 둘 다 거래 가능한
    # 전략이라 양 시장 형평 있게 0.2.
    # 2026-08-17: KR 0.2 → 0.1 — 갈래 A/B(spec §5)에 KR 50%를 내주려 갈래 C
    # 기존 비중을 균등 x0.5(파일 상단 "3갈래 자본 배분" 표 참고).
    # 2026-08-18: US 0.2 → 0.1 — scalp_1m US에 0.1 이관(2026-08-18-scalp-1m-design
    # 스펙 §배분: 같은 유니버스에서 intraday_scan(5분봉 대기 진입)과 scalp_1m
    # (1분봉 조기 진입)을 나란히 채점).
    capital_fraction:
      KR: 0.1
      US: 0.1
    validation:
      status: burn_in # 백테스트 미검증 — 스코어보드 30건 + 유의(양) 전까지 승격 금지
    universe: watchlist
    symbols: []
    params:
      bar_interval_minutes: 5
      entry_start_minutes_after_open: 30 # orb_scan 창(개장 5분)과 배타 — 그 뒤부터 본다
      no_entry_minutes_before_close: 60
      min_session_bars: 6
      volume_mult: 2.0
      atr_period: 14
      atr_stop_mult: 0.35
      atr_interval: 1d
      # --- 청산 규율 (2026-08-21 원장 재생 실측) ------------------------------
      # 라이브 원장 종결 63건 중 1분봉 재생 가능한 27건에 사전 지정 청산 규칙을
      # 재생했다(탐색 5회, 사후 튜닝 없음). 전체 27건 기준:
      #   현행(원장)             중앙 -85.4bp 평균 -77.3bp 승률 19% 합계 -2,087
      #   익절+100 / 손절-100     중앙  -7.6bp 평균 -13.8bp 승률 48% 합계   -371
      #   익절+100 / 손절없음      중앙 +86.2bp 평균 -37.5bp 승률 67% 합계 -1,013
      #   마감까지 보유            중앙-149.3bp 평균-194.8bp 승률 26% 합계 -5,259
      # 진입 시점의 당일 레인지 위치는 승패를 가르지 못했다(rho=+0.00, 승 0.84 vs
      # 패 0.89) — **고칠 곳은 진입이 아니라 청산**이라는 게 이 표의 요지다.
      # 보유 중 최대유리(MFE) 중앙은 +113bp인데 실현은 -47bp였다: 이익 구간에
      # 들어갔다가 되돌림을 그대로 맞았다.
      #
      # 주의: 표본 27건(전체 63건 중 1분봉 보유분만)이라 **판단 불가에 가깝다**.
      # 모의 계좌에서 앞으로 쌓일 원장이 이 값을 재판정한다. 비용 20bp는 이미
      # 차감한 수치다.
      # profit_target_r 1.0 + stop_max_bps 100 = 익절 +100bp / 손절 -100bp.
      # (target = entry + r x (entry - stop), stop 은 상한이 걸려 진입가 -100bp)
      profit_target_r: 1.0 # 2026-08-21: null(EoD까지 보유) → 1.0. 위 표 참고
      # 손절 거리 상한(bp). ATR 손절은 실측 R=1.5~4.5%로 이보다 훨씬 넓었다.
      # **사이징(target_weight)은 원래의 넓은 risk_pct 기준 그대로다** — 좁아진
      # 손절로 사이징을 다시 하면 명목이 max_leverage 까지 부풀어 2배 이상 커진다.
      stop_max_bps: 100
      # 2026-08-10 사용자 결정: 유효한 진입 신호를 '이미 보유/이미 진입'으로 막지
      # 않는다. 0 = 하루 진입 횟수 무제한. 폭주는 봉 단위 가드(같은 완성봉 1회)와
      # 리스크 레일(잔여룸·총노출·하루 주문 상한·손절 후 쿨다운)이 막는다.
      max_entries_per_day: 0
      allow_add_while_holding: true
      risk_budget_pct: 1.0
      max_leverage: 1.0
      flatten_before_close_minutes: 1

  orb_scan:
    class: orb_scan
    # paper 검증 가동 (2026-08-09). 수익성 주장은 여전히 없음(orb_scan.py docstring) —
    # 번인 데이터(세션 성적표의 거래당 bps)가 쌓여야 실전 판단 근거가 된다.
    # 2026-08-25 소유자 지시(전략 4종 체제): 한국장 중심 재편 — ①뉴스·미국섹터
    # 개장 단타(news_momentum) ②1분봉 스캘핑(scalp_1m) ③종가배팅(close_bet, 신규)
    # ④외국인 추세(frgn_accumulate). 이 4종과 겹치지 않는 전략은 오늘 미국장부터
    # **비활성** — 코드·원장은 남긴다(측정 기준점 + 추후 복원).
    enabled: false
    # 2026-08-12: news_momentum 추가로 활성 burn_in 전략이 6→7개가 됐다. orb_scan은
    # declared 0.4가 burn_in 상한(0.2)에 캡핑돼 다른 burn_in 전략(각 0.1)의 2배를
    # 받고 있었다 — 승격도 안 된 전략이 형평 없이 더 큰 배분을 갖고 있을 근거가
    # 없다. 다른 burn_in 전략과 같은 0.1로 낮춰 news_momentum 0.1을 흡수한다
    # (검증 게이트 통과 시 declared 값만 올리면 원상복구된다 — 캡은 그대로 0.2).
    # 2026-08-12(2차) 시장별 분리(파일 상단 표 참고): KR/US 둘 다 거래 가능.
    # US 0.15 → 0.2 (2026-08-12 3차): mean_reversion이 구조상 US를 못 쓰는 것이
    # 확인돼 회수한 0.1을 US에서 실제 거래 가능한 전략에 나눴다. 사용자 관찰
    # ("돌파 계열이 잘 감지된다")과도 방향이 같지만, **성과 근거는 아니다** —
    # orb_scan 종결 0건이다. burn_in 캡(0.2)까지만 올린다.
    # 2026-08-17: KR 0.2 → 0.1 — 갈래 A/B(spec §5)에 KR 50%를 내주려 갈래 C
    # 기존 비중을 균등 x0.5(파일 상단 "3갈래 자본 배분" 표 참고). US는 불변.
    capital_fraction:
      KR: 0.1
      US: 0.2
    validation:
      status: burn_in # TQQQ in-sample 파라미터를 임의 종목에 이식 [미검증] — KR 재측정 전까지
    universe: watchlist # 세션 롤에 관심종목 유니버스에서 symbols를 다시 받는다 (assembly의 재조립 opt-in)
    symbols: [] # watchlist 유니버스가 채운다 — 고정 쌍 전략(donchian/orb)과 달리 임의 종목을 받는 유일한 전략
    params:
      # 규칙은 orb(논문판)와 동일하되 종목별 독립·롱 온리(임의 종목엔 인버스 쌍이
      # 없어 음봉은 스킵). 도지 0.50%/ATR x0.35는 TQQQ in-sample 최적을 이식한
      # 것일 뿐 임의 종목에서 맞다는 근거는 없다 [미검증].
      bar_interval_minutes: 5
      opening_range_minutes: 5
      doji_threshold_pct: 0.50
      stop_mode: atr_pct
      atr_period: 14
      atr_stop_mult: 0.35
      atr_interval: 1d
      # 2026-08-21: intraday_scan 과 같은 근거·같은 값(두 전략은 손절/목표가
      # 산식이 동일하다). 실측 표는 intraday_scan 블록 주석 참고.
      profit_target_r: 1.0
      stop_max_bps: 100
      max_entries_per_day: 0 # 무제한 — 진입 창이 개장 5분 1회라 사실상 하루 1회다
      allow_add_while_holding: true
      # 2026-08-10 공격적 베이스라인: 1.0 → 1.5. 리스크 감사 실측 주의: 손절거리
      # (0.35 x 일봉ATR%)가 ~3% 미만이면 max_position_pct 클램프에 포화돼 이 값은
      # 효과가 없다 — 고변동 종목(ATR 8%+)에서만 바인딩된다. 일 손실 한도 3%는
      # "실현손실 기준 신규 진입 차단"이지 열린 포지션의 하방 캡이 아니다.
      risk_budget_pct: 1.5
      max_leverage: 1.0
      flatten_before_close_minutes: 1

  mean_reversion:
    class: mean_reversion
    # 2026-08-11 신호 다양화: 기존 3전략이 전부 돌파·모멘텀 계열이라 평균회귀 축이
    # 비어 있었다. NYU Stern 백테스트 서베이(2025)에서 평균회귀 계열(PAMR/CWMR/
    # OLMAR)이 리스크 조정 수익 상위권으로 보고됨 — paper 번인 시작, 백테스트 미검증.
    # 2026-08-25 소유자 지시(전략 4종 체제): 한국장 중심 재편 — ①뉴스·미국섹터
    # 개장 단타(news_momentum) ②1분봉 스캘핑(scalp_1m) ③종가배팅(close_bet, 신규)
    # ④외국인 추세(frgn_accumulate). 이 4종과 겹치지 않는 전략은 오늘 미국장부터
    # **비활성** — 코드·원장은 남긴다(측정 기준점 + 추후 복원).
    enabled: false
